# Publish the nightly pre-release.
#
# Decoupled from the per-platform builds: this does NOT trigger them. It picks
# the newest master commit with a successful run of EVERY `-aot` workflow,
# gathers those runs' distributable bundles, and refreshes a single rolling
# pre-release. One commit means one build version on every asset
# (<version>~b<N>.g<hash>, see .github/scripts/eco-version.sh); a platform that
# is red holds the nightly back at the last commit all three built.
#
# The tag is derived from version.txt: v<version>-nightly (e.g. v0.1.0-nightly).
# It is MOVED to the published commit on every run (the new release is
# staged as a draft, then swapped in for the old one) so tags never accumulate. Assets are anonymously downloadable at
#   https://github.com/eco-lang/eco-compiler/releases/download/v<ver>-nightly/<asset>
# Asset names carry the build version, so they change with every nightly.
name: publish-nightly

on:
  schedule:
    # After the 06:00-06:40 build crons clear; linux-aot (its three jobs in
    # parallel) is the slowest; see plans/nightly-build-publishing.md (Risks).
    - cron: '0 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Never let two nightly publishes race on the rolling tag.
  group: publish-nightly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: ordering the candidate commits and computing their
          # build number (eco-version.sh) both walk it.
          fetch-depth: 0

      - name: Pick the newest commit green on every platform
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in mac-aot.yml linux-aot.yml win-aot.yml; do
            gh run list --workflow "$wf" --branch master --status success \
              --limit 50 --json databaseId,headSha,createdAt > "green-$wf.json"
            jq -r '.[].headSha' "green-$wf.json" | sort -u > "shas-$wf.txt"
          done
          comm -12 shas-mac-aot.yml.txt shas-linux-aot.yml.txt \
            | comm -12 - shas-win-aot.yml.txt > common.txt
          # Newest = the most commits behind it. A SHA no longer in master's
          # history (force-push) has no count and is skipped.
          sha="" best=-1
          while read -r s; do
            n=$(git rev-list --count "$s" 2>/dev/null) || continue
            if [ "$n" -gt "$best" ]; then best=$n sha=$s; fi
          done < common.txt
          if [ -z "$sha" ]; then
            echo "::error::no master commit has a green mac-aot, linux-aot and win-aot run (last 50 each)"
            exit 1
          fi
          version=$(.github/scripts/eco-version.sh "$sha")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $sha as eco $version"

      - name: Download that commit's build from each platform
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p stage dist
          for wf in mac-aot.yml linux-aot.yml win-aot.yml; do
            rid=$(jq -r --arg s "$SHA" \
                    '[.[] | select(.headSha == $s)] | max_by(.createdAt) | .databaseId' \
                    "green-$wf.json")
            echo "::group::$wf -> run $rid"
            gh run download "$rid" --dir "stage/$wf"
            gh run view "$rid" --json headSha,url,createdAt,displayTitle > "stage/$wf.meta.json"
            cat "stage/$wf.meta.json"
            echo "::endgroup::"
          done

      - name: Collect distributables + checksums
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          # Extension filter drops the raw eco / eco.exe binaries and the log
          # artifacts that share those upload bundles.
          find stage -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) \
               -exec cp -n {} dist/ \;
          # Every asset must be the picked build: a run from before the build
          # number existed, or one that computed another version, fails here.
          stray=$(ls dist | grep -vF -- "$VERSION" || true)
          if [ -n "$stray" ]; then
            echo "::error::assets not built as $VERSION:"; echo "$stray"; exit 1
          fi
          ( cd dist && sha256sum * | tee SHA256SUMS )
          echo "=== nightly asset set ==="
          ls -la dist/

      - name: Compute rolling tag + target commit
        id: meta
        run: |
          set -euo pipefail
          nightly_tag="v$(tr -d '[:space:]' < version.txt)-nightly"
          sha="${{ steps.pick.outputs.sha }}"
          echo "nightly_tag=$nightly_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rolling tag $nightly_tag -> $sha"

      - name: Build release notes
        env:
          NIGHTLY_TAG: ${{ steps.meta.outputs.nightly_tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Rolling nightly pre-release — **moves on every build**, not a fixed point in time."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Target commit: \`$SHA\`"
            echo
            echo "### Source builds (all from the target commit)"
            echo
            echo "| Platform | Commit | Run |"
            echo "|---|---|---|"
            for wf in mac-aot linux-aot win-aot; do
              f="stage/$wf.yml.meta.json"
              printf '| %s | `%s` | %s |\n' \
                "$wf" \
                "$(jq -r '.headSha[0:12]' "$f")" \
                "$(jq -r '.url' "$f")"
            done
            echo
            echo "### SHA256SUMS"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md

      - name: Move the rolling tag + refresh assets
        # Replace the release only once its successor is ready, so a failure
        # anywhere before the swap leaves the current nightly in place (a
        # delete-then-create here once deleted it and then failed to create).
        #   1. Probe: create and delete a throwaway tag at the target commit.
        #      GitHub refuses the workflow token a tag at some commits (on
        #      2026-10-13, one whose .github/workflows differed from master's
        #      head: "HTTP 403: Resource not accessible by integration"), and
        #      the release's own tag would fail the same way.
        #   2. Stage: a draft release (drafts create no tag) carrying every
        #      asset; any failure deletes the draft.
        #   3. Swap: delete the old release and its tag, then publish the draft
        #      under the rolling tag, which creates the tag at the target.
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.meta.outputs.nightly_tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          title="Nightly $VERSION ($(date -u '+%Y-%m-%d'))"

          probe="eco-nightly-probe-$GITHUB_RUN_ID"
          if ! gh api -X POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$probe" -f sha="$SHA" >/dev/null 2>probe.err; then
            echo "::error::cannot create a tag at $SHA: $(cat probe.err). Keeping the current $NIGHTLY_TAG release."
            exit 1
          fi
          gh api -X DELETE "repos/$repo/git/refs/tags/$probe" >/dev/null

          id=$(gh api -X POST "repos/$repo/releases" \
                 -f tag_name="$NIGHTLY_TAG-next-$GITHUB_RUN_ID" -f target_commitish="$SHA" \
                 -f name="$title" -F body=@notes.md -F draft=true -F prerelease=true \
                 --jq .id)
          trap 'gh api -X DELETE "repos/$repo/releases/$id" >/dev/null 2>&1 || true' ERR
          for f in dist/*; do
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$repo/releases/$id/assets?name=$(basename "$f")" \
              >/dev/null
            echo "staged $(basename "$f")"
          done
          trap - ERR

          gh release delete "$NIGHTLY_TAG" --cleanup-tag --yes 2>/dev/null || true
          gh api -X PATCH "repos/$repo/releases/$id" \
            -f tag_name="$NIGHTLY_TAG" -f target_commitish="$SHA" -F draft=false >/dev/null
          gh release view "$NIGHTLY_TAG" --json tagName,url,assets \
            --jq '"published \(.tagName) with \(.assets|length) assets: \(.url)"'

      - name: Prune stale -nightly pre-releases (only after a version bump)
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ steps.meta.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          # -daily is the rolling tag's old name (until 2026-10-14); matching
          # it removes the last v0.2.0-daily release on the first run.
          gh release list --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease) | .tagName' \
            | grep -E '^v.*-(nightly|daily)$' | grep -vx "$NIGHTLY_TAG" \
            | xargs -r -n1 -I{} gh release delete {} --cleanup-tag --yes || true
          # Drafts a failed "Move the rolling tag" left behind (tag_name
          # <nightly>-next-<run id>; drafts own no tag, so delete by release id).
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q '.[] | select(.draft and (.tag_name | test("-nightly-next-[0-9]+$"))) | .id' \
            | xargs -r -n1 -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}" || true
