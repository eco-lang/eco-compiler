# Linux LLVM/MLIR base-image builder + cache warmer.
#
# The Linux CI path runs inside Docker (unlike the mac/win workflows which
# build on the bare runner). Two slow LLVM/MLIR base images underpin every
# Linux consumer image:
#
#   eco-llvm-debian:<ver>  -> consumed by docker/eco-dev.Dockerfile
#                             (glibc dev shell; linux-bootstrap)
#   eco-llvm-alpine:<ver>  -> consumed by docker/static-build.Dockerfile
#                             (static musl binary + bundles; linux-aot)
#
# Each base compiles LLVM+MLIR from source (~30-60 min) and is rebuilt only
# when LLVM_VERSION (or the base Dockerfile) changes. This workflow builds
# both and stores them as `docker save | gzip` tarballs in the Actions cache,
# keyed on the base Dockerfile hash. linux-bootstrap / linux-aot restore the
# tarball and `docker load` it in seconds instead of recompiling LLVM.
#
# Cache scope note: a cache produced on the default branch (master) is
# readable from every branch, so warming it here on a master push makes the
# images available to all subsequent consumer runs.
name: linux-llvm-build

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'docker/llvm-debian.Dockerfile'
      - 'docker/llvm-alpine.Dockerfile'
      - '.github/workflows/linux-llvm-build.yml'
  workflow_dispatch:

env:
  LLVM_VERSION: '21.1.8'

jobs:
  llvm:
    runs-on: ubuntu-latest
    # LLVM+MLIR Release build from source on a hosted runner is slow; pin
    # well clear of the cap. A cache hit short-circuits to seconds.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: docker/llvm-debian.Dockerfile
          - variant: alpine
            dockerfile: docker/llvm-alpine.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # LLVM source builds are disk-hungry; reclaim the preinstalled SDKs
        # the hosted image ships that we never use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Cache LLVM base image (${{ matrix.variant }})
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/eco-llvm-${{ matrix.variant }}.tar.gz
          # Bump nothing by hand: the Dockerfile hash + version pin the key,
          # so any change to the base recipe rebuilds rather than serving a
          # stale image.
          key: eco-llvm-${{ matrix.variant }}-${{ env.LLVM_VERSION }}-${{ hashFiles(matrix.dockerfile) }}

      - name: Build LLVM + MLIR base image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          img="eco-llvm-${{ matrix.variant }}:${{ env.LLVM_VERSION }}"
          echo "Building $img from ${{ matrix.dockerfile }} (no cache hit) ..."
          docker build -f ${{ matrix.dockerfile }} -t "$img" .
          docker save "$img" | gzip > /tmp/eco-llvm-${{ matrix.variant }}.tar.gz
          ls -lh /tmp/eco-llvm-${{ matrix.variant }}.tar.gz

      - name: Report restored image
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          ls -lh /tmp/eco-llvm-${{ matrix.variant }}.tar.gz
          echo "eco-llvm-${{ matrix.variant }}:${{ env.LLVM_VERSION }} already cached — rebuild skipped."
