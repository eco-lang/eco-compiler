# Linux — single consolidated build: the full bootstrap + every test gateway,
# then the shippable fully-static distribution bundle.
#
# Unlike mac/win (one toolchain), Linux runs TWO toolchains and so this
# workflow has TWO jobs:
#
#   job `test`   (glibc / debian, docker/eco-dev.Dockerfile): the full
#                9-stage self-hosting bootstrap + all test gateways
#                (Gate A `full`+JIT-E2E, elm-tests, stress, bootstrap stages
#                incl. JS-4b & native-8c fixed points, Gate B AOT-E2E).
#                This is the former `linux-bootstrap` workflow.
#
#   job `bundle` (musl / alpine, docker/static-build.Dockerfile,
#                `needs: test`): builds the fully-static `eco`, runs the
#                smoke/ELF-contract gates, and exports the release bundle set
#                (.tar.gz / .zip / .deb). This is the former `linux-aot`.
#                It runs only if `test` is green, so we never ship an artifact
#                that failed the gateways.
#
# We ship the musl-static binary (portability) but validate the suite on
# glibc, where the dev toolchain lives and the self-host bootstrap is reliable
# (the musl self-host has a known-flaky `Map.!` readdir-ordering bug — see
# plans/static-link-eco-binary.md). The two slow LLVM base images are restored
# from the Actions cache populated by linux-llvm-build-debian (glibc) and
# linux-llvm-build-alpine (musl).
name: linux-aot

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'elm-kernel-cpp/**'
      - 'eco-kernel-cpp/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'version.txt'
      - 'docker/eco-dev.Dockerfile'
      - 'docker/eco-dev-entrypoint.sh'
      - 'docker/llvm-debian.Dockerfile'
      - 'docker/static-build.Dockerfile'
      - 'docker/llvm-alpine.Dockerfile'
      - '.github/workflows/linux-aot.yml'
  workflow_dispatch:
  schedule:
    # Daily build keeps the debian + alpine LLVM caches accessed (a restore
    # resets GitHub's 7-day eviction timer). Inert until merged to master.
    - cron: '20 6 * * *'

env:
  LLVM_VERSION: '21.1.8'
  DOCKER_BUILDKIT: '1'

jobs:
  # ===========================================================================
  # Gateway suite — full bootstrap + tests on the glibc dev image.
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Restore LLVM debian base image (from linux-llvm-build-debian)
        # fail-on-cache-miss: the debian base is warmed by linux-llvm-build-debian
        # and consumed here, so linux-aot never drops into the slow ~1h inline
        # LLVM rebuild. A cold cache fails fast and legibly — run
        # linux-llvm-build-debian first, then re-run. (Same contract as the
        # alpine base in the bundle job.)
        uses: actions/cache@v4
        with:
          path: /tmp/eco-llvm-debian.tar.gz
          # Same key linux-llvm-build-debian writes, so a warm cache is reused.
          key: eco-llvm-debian-${{ env.LLVM_VERSION }}-${{ hashFiles('docker/llvm-debian.Dockerfile') }}
          fail-on-cache-miss: true

      - name: Load LLVM debian base image
        run: |
          img="eco-llvm-debian:${{ env.LLVM_VERSION }}"
          echo "Loading cached $img ..."
          gunzip -c /tmp/eco-llvm-debian.tar.gz | docker load
          docker image ls "$img"

      - name: Build eco-dev image
        run: docker build -f docker/eco-dev.Dockerfile -t eco-dev .

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          # eco-dev sets CCACHE_DIR=/work/.ccache; /work is the bind-mounted
          # workspace, so the cache lands here and survives between runs.
          path: .ccache
          key: linux-bootstrap-ccache-${{ github.sha }}
          restore-keys: linux-bootstrap-ccache-

      - name: Bootstrap pipeline + test gateways (inside eco-dev)
        run: |
          # The script runs in /work (bind-mounted) and is exec'd by the
          # eco-dev entrypoint as the host-uid user (gosu), inheriting the
          # image's LLVM/ccache/clang environment.
          cat > ci-linux-bootstrap.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          # Self-compilation (Stages 2+) needs a 12 GB Node heap.
          export NODE_OPTIONS="--max-old-space-size=12000"
          # Logs go under the bind-mounted workspace so the host upload step
          # (which runs outside the container) can collect them.
          mkdir -p /work/ci-logs

          echo "::group::Configure (build preset)"
          cmake --preset build
          echo "::endgroup::"

          echo "::group::Gate A — clean rebuild + JIT E2E (target: full)"
          cmake --build build --target full
          echo "::endgroup::"

          echo "::group::elm-tests (compiler Elm suite)"
          set +e
          cmake --build build --target elm-tests 2>&1 | tee /work/ci-logs/elm-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # elm-test-rs exits non-zero when a Test.skip makes the run
            # "incomplete" even with zero real failures. Accept iff the log
            # proves nothing actually failed; anything else is a regression.
            if { [ "$rc" -eq 1 ] || [ "$rc" -eq 2 ]; } && grep -qE 'Failed: +0' /work/ci-logs/elm-tests.log; then
              echo "OK: elm-tests passed (Test.skip incomplete, no failures)"
            else
              echo "ERROR: elm-tests failed (rc=$rc)"; exit "$rc"
            fi
          fi
          echo "::endgroup::"

          echo "::group::Stress tests"
          cmake --build build --target stress
          echo "::endgroup::"

          echo "::group::Full bootstrap (stages 1-9 + fixed-point gates)"
          cmake --build build --target bootstrap
          echo "::endgroup::"

          echo "::group::Gate B — AOT E2E (target: run-aot-e2e)"
          set +e
          cmake --build build --target run-aot-e2e 2>&1 | tee /work/ci-logs/aot-e2e.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # FlagsRecordTest and PortEchoTest need program flags / port stdin
            # that the AOT harness (run_elf) does not feed; both pass under the
            # JIT gate above. Tolerate exactly those two — any other AOT
            # failure is a real regression and must fail the build.
            unexpected="$(grep -E '^FAIL ' /work/ci-logs/aot-e2e.log | grep -vE 'FlagsRecordTest|PortEchoTest' || true)"
            if [ -n "$unexpected" ]; then
              echo "ERROR: unexpected AOT E2E failures:"; echo "$unexpected"; exit 1
            fi
            echo "OK: AOT E2E — only the known harness-limited tests failed (FlagsRecordTest, PortEchoTest)"
          fi
          echo "::endgroup::"
          EOS
          chmod +x ci-linux-bootstrap.sh
          docker run --rm \
            -v "$PWD":/work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            eco-dev bash /work/ci-linux-bootstrap.sh

      - name: Report outputs and timings
        if: always()
        run: |
          echo "=== bootstrap outputs ==="
          ls -la build/compiler/build-xhr/bin/ 2>/dev/null || true
          ls -la build/compiler/build-kernel/bin/ 2>/dev/null || true
          echo "=== stage timing logs ==="
          for f in build/compiler/build-kernel/timing-*.txt; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done

      - name: ccache stats
        if: always()
        run: |
          docker run --rm -v "$PWD":/work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            eco-dev bash -lc 'ccache -s | head -15' || true

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: |
            build/compiler/build-kernel/timing-*.txt
            ci-logs/elm-tests.log
            ci-logs/aot-e2e.log
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # Distribution — fully-static musl binary + release bundles. Ships only if
  # the gateway suite (`test`) is green.
  # ===========================================================================
  bundle:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Throwaway registry on localhost:5000. The cached alpine LLVM base image is
    # `docker load`ed into the host daemon, but the cache-dance below forces a
    # `docker-container` buildx driver, which CANNOT see the host daemon's image
    # store — so `FROM ${LLVM_IMAGE}` would fall through to a Docker Hub pull and
    # fail. We push the loaded image here and build against localhost:5000 with a
    # host-networked builder so the base image resolves locally.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Restore LLVM alpine base image (from linux-llvm-build-alpine)
        # fail-on-cache-miss: the alpine LLVM-from-source rebuild OOMs the
        # hosted runner (it was the cause of the 3h+ "runner lost
        # communication" failures), so we DO NOT fall back to a local build.
        # The cache is populated by linux-llvm-build-alpine and kept warm by the
        # daily schedule; a cold cache fails fast and legibly — re-run
        # linux-llvm-build-alpine.
        uses: actions/cache@v4
        with:
          path: /tmp/eco-llvm-alpine.tar.gz
          key: eco-llvm-alpine-${{ env.LLVM_VERSION }}-${{ hashFiles('docker/llvm-alpine.Dockerfile') }}
          fail-on-cache-miss: true

      - name: Load LLVM alpine base image
        run: |
          img="eco-llvm-alpine:${{ env.LLVM_VERSION }}"
          echo "Loading cached $img ..."
          gunzip -c /tmp/eco-llvm-alpine.tar.gz | docker load
          docker image ls "$img"
          # Publish to the local registry so the docker-container buildx builder
          # (which can't see the host daemon store) can resolve it as a base.
          docker tag "$img" "localhost:5000/$img"
          docker push "localhost:5000/$img"

      # ccache for the in-Docker eco compile. The cache lives in a BuildKit
      # cache mount (docker/static-build.Dockerfile), which is per-builder and
      # would not survive between runners — so buildx + the cache-dance below
      # sync it to a host dir that actions/cache persists. The first run is cold
      # (no speedup); subsequent runs reuse object files for unchanged TUs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Host networking so the container-driver builder can reach the
          # registry service published on localhost:5000.
          driver-opts: network=host

      - name: Restore bundle ccache
        id: bundle-ccache
        uses: actions/cache@v4
        with:
          path: ccache-bundle
          key: bundle-ccache-${{ github.sha }}
          restore-keys: bundle-ccache-

      - name: Sync ccache into the BuildKit cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            { "ccache-bundle": "/ccache" }
          skip-extraction: ${{ steps.bundle-ccache.outputs.cache-hit }}

      - name: Build static eco + run all smoke gates
        # Default target = glibc-smoke, the last stage, so this single build
        # compiles the static binary and runs every smoke/ELF-contract gate.
        # `buildx build` (not plain `docker build`) so it runs on the buildx
        # builder whose /ccache mount the cache-dance syncs.
        run: |
          docker buildx build -f docker/static-build.Dockerfile \
            --build-arg LLVM_IMAGE=localhost:5000/eco-llvm-alpine:${{ env.LLVM_VERSION }} \
            -t eco-static-ci .

      - name: Export distribution bundles to ./dist
        # Re-uses the eco-builder layers cached by the build above (same
        # BuildKit daemon), so this only runs CPack + the export exporter.
        run: |
          docker buildx build -f docker/static-build.Dockerfile --target eco-bundle \
            --build-arg LLVM_IMAGE=localhost:5000/eco-llvm-alpine:${{ env.LLVM_VERSION }} \
            -o ./dist .
          ls -la dist/

      - name: Verify fully-static eco binary
        run: |
          # --load: the buildx container driver does not auto-load -t images
          # into the docker daemon, but the docker create below needs it there.
          docker buildx build -f docker/static-build.Dockerfile --target eco-static \
            --build-arg LLVM_IMAGE=localhost:5000/eco-llvm-alpine:${{ env.LLVM_VERSION }} \
            -t eco-static-ci-bin --load .
          id=$(docker create eco-static-ci-bin)
          docker cp "$id:/eco" ./eco
          docker rm "$id"
          file ./eco
          needed=$(readelf -d ./eco | grep -c NEEDED || true)
          echo "NEEDED dynamic entries: $needed (expect 0)"
          [ "$needed" -eq 0 ] || { echo "ERROR: eco is not fully static"; exit 1; }
          ./eco --version || true
          echo "OK: eco is a fully-static binary"

      - name: Upload distribution bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-aot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            eco
          if-no-files-found: warn
          retention-days: 7
