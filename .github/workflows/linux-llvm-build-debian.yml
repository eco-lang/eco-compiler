# Linux LLVM/MLIR base-image builder — DEBIAN (glibc) variant.
#
# The Linux CI path runs inside Docker. The debian LLVM/MLIR base image:
#
#   ghcr.io/eco-lang/eco-llvm-debian:<ver>-<hash>
#       -> consumed by docker/eco-dev.Dockerfile
#          (glibc dev shell; linux-aot `test` and `bootstrap` jobs)
#
# compiles LLVM+MLIR from source and is rebuilt only when LLVM_VERSION or the
# base Dockerfile changes: <hash> is the first 12 hex digits of the hash of
# docker/llvm-debian.Dockerfile, so any change to the recipe gets a new tag.
# This workflow publishes it to the GitHub Container Registry (GHCR), which
# keeps it permanently and outside the repository's 10 GB Actions cache.
#
# It used to live in the Actions cache as a `docker save | gzip` tarball, where
# its 3 GB pushed the Windows and macOS LLVM install trees out of the cache.
# While that tarball still exists, this workflow publishes it as is rather than
# rebuilding LLVM (about an hour); it never saves a new one.
#
# linux-aot does NOT fall back to a local build, so the image MUST be in GHCR
# first: run this workflow to green before linux-aot uses a new tag.
name: linux-llvm-build-debian

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'docker/llvm-debian.Dockerfile'
      - '.github/workflows/linux-llvm-build-debian.yml'
  workflow_dispatch:

env:
  LLVM_VERSION: '21.1.8'

jobs:
  llvm:
    runs-on: ubuntu-latest
    # LLVM+MLIR Release build from source on a hosted runner is slow; pin
    # well clear of the cap. An image already in GHCR short-circuits to seconds.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check GHCR for the image
        id: ghcr
        run: |
          h="${{ hashFiles('docker/llvm-debian.Dockerfile') }}"
          ref="ghcr.io/${{ github.repository_owner }}/eco-llvm-debian:${LLVM_VERSION}-${h:0:12}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "$ref is already in GHCR; nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "$ref is not in GHCR yet."
          fi

      - name: Free disk space
        # LLVM source builds are disk-hungry; reclaim the preinstalled SDKs
        # the hosted image ships that we never use.
        if: steps.ghcr.outputs.present != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Restore the image tarball from the Actions cache (migration only)
        # Restore only: nothing saves this tarball any more. Once it has been
        # deleted from the cache, this always misses and the image is built.
        id: tarball
        if: steps.ghcr.outputs.present != 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/eco-llvm-debian.tar.gz
          key: eco-llvm-debian-${{ env.LLVM_VERSION }}-${{ hashFiles('docker/llvm-debian.Dockerfile') }}

      - name: Load the image from the tarball
        if: steps.ghcr.outputs.present != 'true' && steps.tarball.outputs.cache-hit == 'true'
        run: |
          gunzip -c /tmp/eco-llvm-debian.tar.gz | docker load
          rm -f /tmp/eco-llvm-debian.tar.gz
          docker tag "eco-llvm-debian:${LLVM_VERSION}" eco-llvm-debian:base

      - name: Build LLVM + MLIR base image
        if: steps.ghcr.outputs.present != 'true' && steps.tarball.outputs.cache-hit != 'true'
        run: |
          echo "Building from docker/llvm-debian.Dockerfile (not in GHCR, no tarball) ..."
          docker build -f docker/llvm-debian.Dockerfile -t eco-llvm-debian:base .

      - name: Push the image to GHCR
        # The one-line rebuild adds the label that links the package to this
        # repository, so it shows on the repository page and inherits its access.
        if: steps.ghcr.outputs.present != 'true'
        run: |
          ref="${{ steps.ghcr.outputs.ref }}"
          echo "FROM eco-llvm-debian:base" | docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -t "$ref" -
          docker push "$ref"
          echo "Pushed $ref"
