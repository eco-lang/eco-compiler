# Promote a built commit to a permanent, downloadable stable Release.
#
# Triggered by pushing a real version tag (v0.1.0). The same push starts
# mac-aot, linux-aot and win-aot on the tag, which build the plain version
# (no ~b<N>.g<hash> suffix; .github/scripts/eco-version.sh) and fail if the tag
# does not match version.txt. This waits for those three runs and publishes
# their bundles, failing if any is red — provenance matters for a stable
# release. After fixing a red build, re-run it, then re-run this.
# Published as a non-prerelease, so /releases/latest flips to it.
#
# The rolling nightly tag (v*-nightly) is excluded so moving it never cuts a
# stable release (GITHUB_TOKEN-created tags also do not cascade-trigger, but the
# exclusion is explicit belt-and-suspenders).
name: release

on:
  push:
    tags:
      - 'v*'
      - '!v*-nightly'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The tag builds take about 70 min (mac-aot is the slowest), plus queueing.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the tag builds and download them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p stage dist
          start=$(date +%s)
          for wf in mac-aot.yml linux-aot.yml win-aot.yml; do
            echo "::group::$wf on $TAG"
            while :; do
              # A tag push's runs carry the tag name as their branch.
              run=$(gh run list --workflow "$wf" --branch "$TAG" --event push --commit "$SHA" \
                      --limit 1 --json databaseId,status,conclusion,url -q '.[0] // empty')
              elapsed=$(( $(date +%s) - start ))
              if [ -z "$run" ]; then
                if [ "$elapsed" -gt 900 ]; then
                  echo "::error::no $wf run started for $TAG after 15 min"; exit 1
                fi
              elif [ "$(jq -r .status <<<"$run")" = completed ]; then
                break
              fi
              sleep 60
            done
            echo "$run"
            if [ "$(jq -r .conclusion <<<"$run")" != success ]; then
              echo "::error::$wf did not pass on $TAG: $(jq -r .url <<<"$run")"; exit 1
            fi
            gh run download "$(jq -r .databaseId <<<"$run")" --dir "stage/$wf"
            echo "::endgroup::"
          done

      - name: Collect distributables + checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          find stage -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \) \
               -exec cp -n {} dist/ \;
          # Every asset must carry exactly the release version, not a
          # ~b<N>.g<hash> build version.
          v="${VERSION#v}"
          stray=$(ls dist | grep -vE "^eco[-_]${v//./\\.}[-_]" || true)
          if [ -n "$stray" ]; then
            echo "::error::assets not built as $v:"; echo "$stray"; exit 1
          fi
          ( cd dist && sha256sum * | tee SHA256SUMS )
          echo "=== release asset set ==="
          ls -la dist/

      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "Stable release \`$TAG\`."
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "### SHA256SUMS"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Non-prerelease -> becomes /releases/latest. The tag already exists
          # (the push that triggered this), so target it as-is.
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            dist/*
