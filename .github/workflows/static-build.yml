# Stage B — build the fully-static `eco` binary inside Alpine/MUSL and prove
# it has zero shared-library dependencies. See
# plans/static-link-eco-binary.md (Stage B) and docker/static-build.Dockerfile.
#
# The image is throwaway; the extracted `eco` binary is the release artifact.
# The llvm-builder stage (LLVM 21.1.4 from source) is the expensive,
# rarely-changing layer — it is cached via the GitHub Actions cache so only
# per-commit eco rebuilds pay the cost.
name: static-build

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'docker/static-build.Dockerfile'
      - 'CMakePresets.json'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'compiler/**'
      - 'runtime/**'
      - 'elm-kernel-cpp/**'
      - 'eco-kernel-cpp/**'
      - '.github/workflows/static-build.yml'

jobs:
  static-eco:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build static eco (scratch image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/static-build.Dockerfile
          target: eco-static
          tags: eco-static:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract the eco binary
        run: |
          id=$(docker create eco-static:ci)
          docker cp "$id:/eco" ./eco
          docker rm "$id"
          chmod +x ./eco

      - name: Verify zero shared-library dependencies
        run: |
          file ./eco
          # readelf prints "no dynamic section" for a fully-static binary;
          # any NEEDED entry means a shared dependency leaked in.
          if readelf -d ./eco 2>/dev/null | grep -q NEEDED; then
            echo "::error::eco has dynamic NEEDED entries — not fully static"
            readelf -d ./eco
            exit 1
          fi
          echo "OK: eco has no NEEDED entries (fully static)"
          ls -lh ./eco

      - name: Smoke-test --help across distros
        run: |
          for img in scratch debian:bookworm-slim ubuntu:24.04 alpine:3.21; do
            echo "=== $img ==="
            if [ "$img" = scratch ]; then
              # The scratch image already has /eco as its entrypoint.
              docker run --rm eco-static:ci --help | head -3
            else
              docker run --rm -v "$PWD/eco:/eco:ro" "$img" /eco --help | head -3
            fi
          done

      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: eco-static-linux-x86_64
          path: ./eco
          if-no-files-found: error
