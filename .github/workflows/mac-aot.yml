# macOS — single consolidated build: full bootstrap + every test gateway +
# the shippable Darwin distribution bundle, in one job.
#
# This replaces the former three-workflow split (mac-bootstrap / mac-runtime /
# mac-aot). macOS has a single toolchain (the static LLVM 21.1.8 tree cached by
# mac-llvm-build), so there is no structural reason to split test-vs-ship;
# folding them removes two redundant configures per push (macOS runners bill
# at 10x). The bundle-smoke job then installs the bundle on a fresh runner set
# up like a typical user's Mac (Command Line Tools only, no Homebrew LLVM or
# OpenSSL).
#
# Steps run cheap -> expensive (fail-fast), mirroring linux's gate order:
#   1. front-end stages 1-5      (pure Node; no LLVM needed) — was mac-bootstrap
#   2. elm-tests                 (compiler's own Elm suite)  — was mac-bootstrap
#   3. JIT E2E (build + run test)                            — was mac-runtime
#   4. Stage 6-9 self-host chain (incl. 8c MLIR fixed point) — was mac-aot
#   5. verify Mach-O -> package Darwin bundle -> smoke-test  — was mac-aot
name: mac-aot

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'elm-kernel-cpp/**'
      - 'eco-kernel-cpp/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'version.txt'
      - 'system-kernel-cpp/**'
      - '.github/workflows/mac-aot.yml'
      - '.github/scripts/prune-caches.sh'
  workflow_dispatch:
  schedule:
    # Daily build keeps the workflow exercised. (schedule only fires from the
    # default branch, so this is inert until merged to master.)
    - cron: '0 6 * * *'

# A newer push to the same branch cancels this run. Master runs each get a
# group of their own, so they are never cancelled or queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  aot:
    runs-on: macos-15
    timeout-minutes: 90
    # actions: write lets "Prune superseded ccache entries" delete caches
    # (the repository's default token is read-only).
    permissions:
      contents: read
      actions: write
    env:
      # The static LLVM/MLIR install tree the mac-build preset links
      # (CMAKE_PREFIX_PATH=$ECO_MAC_DEPS_DIR).
      ECO_MAC_DEPS_DIR: ${{ github.workspace }}/experiments/mac-llvm-build/out/llvm-install
    steps:
      - uses: actions/checkout@v4

      - name: Restore LLVM 21.1.8 install tree (from mac-llvm-build)
        # fail-on-cache-miss: the LLVM source build is mac-llvm-build's job
        # (2-3 h). A cold cache fails fast and legibly — run mac-llvm-build,
        # then re-run this. Same contract as win-aot and linux-aot.
        uses: actions/cache/restore@v4
        with:
          path: experiments/mac-llvm-build/out/llvm-install
          key: mac-llvm-mlir-21.1.8-arm64-macos15.0-release-v1
          fail-on-cache-miss: true

      - name: Install dependencies
        run: |
          # libzip is vendored via FetchContent on APPLE (see
          # eco-kernel-cpp/CMakeLists.txt) so brew's libzip is not needed.
          # openssl@3 provides the static libssl.a/libcrypto.a linked into eco
          # and user programs. pkgconf is still useful for kernel curl/ssl
          # probes. rapidcheck is a configure-time dep of the ecor target
          # (find_package); Homebrew has no formula for it, so build it from
          # source, for the same minimum macOS as everything else.
          brew install openssl@3 pnpm gnu-time pkgconf ccache
          git clone --depth=1 https://github.com/emil-e/rapidcheck.git /tmp/rapidcheck
          cmake -S /tmp/rapidcheck -B /tmp/rapidcheck/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build /tmp/rapidcheck/build
          sudo cmake --install /tmp/rapidcheck/build

      - name: Tool versions
        run: |
          node --version
          pnpm --version
          cmake --version | head -1
          ninja --version
          sysctl hw.memsize hw.ncpu

      - name: Restore ccache
        # Restore only: branch runs read master's newest ccache and never save
        # one, so per-commit entries cannot pile up and evict the LLVM caches
        # (10 GB Actions cache limit). Saved by "Save ccache" on master only.
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: mac-aot-ccache-${{ github.sha }}
          restore-keys: mac-aot-ccache-

      - name: Configure (mac-build preset, full)
        run: |
          cmake --preset mac-build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # ---- Gateway 1: front-end (stages 1-5). Pure Node — fails a front-end
      #      regression fast, before any heavy C++/LLVM work. ----
      - name: Stages 1-4b (guida.js -> JS fixed point)
        run: cmake --build build --target eco-boot-verify

      - name: Stage 5 (eco-boot-2.js -> eco-compiler.mlir)
        run: cmake --build build --target eco-compiler-mlir

      # ---- Gateway 2: the compiler's own Elm test suite. ----
      - name: elm-tests (compiler's Elm suite via mac elm-test-rs)
        # elm-test-rs 3.0.1 exits 2 ("INCOMPLETE") for the one intentional
        # Test.skip in compiler/tests/ (NoCEcoValueInUserFunctionsTest.elm)
        # even with zero real failures. Accept iff the log proves nothing
        # actually failed.
        run: |
          set +e
          cmake --build build --target elm-tests 2>&1 | tee /tmp/elm-tests.log
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then
              echo "OK: elm-tests passed (no skips)"; exit 0
          fi
          if [ $rc -eq 2 ] && grep -qE 'Failed: +0' /tmp/elm-tests.log; then
              echo "OK: elm-tests passed (Test.skip incomplete, no failures)"
              exit 0
          fi
          echo "ERROR: elm-tests failed (rc=$rc)"; exit $rc

      # ---- Gateway 3: JIT E2E. Builds the runtime + kernels + test harness
      #      and runs the JIT suite — catches runtime/codegen regressions
      #      before the long self-host fixed-point chain. ----
      - name: Build everything (-k 20 to batch errors)
        run: cmake --build build -- -k 20

      - name: Build test binary
        run: cmake --build build --target test -- -k 20

      - name: Run JIT E2E tests
        run: |
          # macos GH Actions default shell is `/bin/bash -e {0}` (no pipefail),
          # so a naive `test | tee` loses the test binary's exit code (it sees
          # tee's 0). Capture PIPESTATUS explicitly.
          set +e
          ./build/test/test 2>&1 | tee /tmp/test_output.txt
          rc=${PIPESTATUS[0]}
          tail -30 /tmp/test_output.txt
          exit $rc

      # ---- Gateway 4: the full Stage 6-9 self-host chain. `--target eco`
      #      transitively pulls Stage 6 (eco-compiler Mach-O), 7a/7b
      #      (self-compile + link), 8a-c (self-compile again + the 8c
      #      MLIR byte-equal fixed-point), 9a/9b (lower + link unified eco).
      #      Stages 1-5 and eco-boot-native are already built above. ----
      - name: Build eco-boot-native + project archives
        run: cmake --build build --target eco-boot-native -- -k 20

      - name: Build Stage 9 — unified eco binary (full bootstrap chain)
        # Logged so the floor gate below can scan the Stage 6-9 links for
        # ld64's "built for newer macOS version" warnings.
        run: |
          set +e
          cmake --build build --target eco -- -k 20 2>&1 | tee /tmp/eco-build.log
          exit ${PIPESTATUS[0]}

      - name: Verify Mach-O output (Stage 9 unified eco)
        run: |
          set +e
          eco_bin=build/compiler/build-kernel/bin/eco
          ls -la $eco_bin
          file $eco_bin
          # Confirm it's arm64 Mach-O and ad-hoc-signed.
          file $eco_bin | grep -q 'Mach-O 64-bit executable arm64' || {
              echo "ERROR: $eco_bin is not arm64 Mach-O"; exit 1; }
          codesign -dv $eco_bin 2>&1 | tee /tmp/codesign.txt
          grep -q 'adhoc' /tmp/codesign.txt || {
              echo "ERROR: $eco_bin is not ad-hoc-signed"; exit 1; }
          # Smoke-run --help. Stage 9 also reaches the in-process
          # EcoNativeDriverStatic linkage so a missing eco_native_lower_and_link
          # weak/strong override would surface here as a SIGABRT.
          $eco_bin --help 2>&1 | tee /tmp/help.txt | head -20
          if grep -qE 'Killed|Segmentation fault|Bus error|Abort' /tmp/help.txt; then
              echo "ERROR: eco --help crashed at runtime"; exit 1
          fi
          echo "OK: unified eco runs as native Mach-O"

      # ---- Ship: package + smoke-test the Darwin bundle in isolation. ----
      - name: Package Darwin bundle (TGZ)
        # CPack picks up the BundleDarwin component from CMakeLists.txt's
        # if(APPLE) install block — eco-boot-native, eco-compiler, project
        # archives + libzip/openssl statics + kernel sources + examples.
        run: |
          cmake --build build --target package -- -k 20
          ls -la build/*.tar.gz
          tar -tzf build/eco-*-darwin.tar.gz | head -40
          echo "..."
          tar -tzf build/eco-*-darwin.tar.gz | wc -l | xargs -I{} echo "Total files: {}"

      - name: Smoke-test the bundle in isolation
        # Extract the tarball to a fresh prefix and run bin/eco from there.
        # resolveFile() finds the project archives via
        # <exe>/../lib/eco-runtime/project — confirms the bundle is
        # self-contained (no implicit dep on the build tree). Then build
        # Hello.elm with it, as the Linux bundle smoke does
        # (docker/static-build.Dockerfile): the link finds clang and the SDK
        # through xcrun at link time, not through build-host paths.
        run: |
          set +e
          mkdir -p /tmp/eco-bundle && cd /tmp/eco-bundle
          tar -xzf "$GITHUB_WORKSPACE"/build/eco-*-darwin.tar.gz
          ls -la bin/ lib/eco-runtime/project/ 2>&1 | head -50
          ./bin/eco --help 2>&1 | head -10
          rc=$?
          if [ $rc -ge 128 ]; then
              echo "ERROR: bin/eco crashed (rc=$rc)"; exit 1
          fi
          echo "OK: bundled eco runs in isolation"

          mkdir -p /tmp/eco-smoke/src && cd /tmp/eco-smoke
          cp "$GITHUB_WORKSPACE"/compiler/examples/elm.json elm.json
          cp "$GITHUB_WORKSPACE"/compiler/examples/src/Hello.elm src/Hello.elm
          /tmp/eco-bundle/bin/eco make src/Hello.elm --output=hello || {
              echo "ERROR: bundled eco make failed"; exit 1; }
          test -x ./hello || { echo "ERROR: no hello executable"; exit 1; }
          # Hello.elm is browser-style Html; headless it exits non-zero, so
          # only a crash (signal) fails the smoke.
          ./hello >/dev/null 2>&1
          rc=$?
          if [ $rc -ge 128 ]; then
              echo "ERROR: hello crashed (rc=$rc)"; exit 1
          fi
          echo "OK: bundled eco built a runnable hello (rc=$rc)"

      - name: Check macOS floor and linked libraries
        # The floor (CMAKE_OSX_DEPLOYMENT_TARGET, 15.0) must hold for eco, the
        # programs it links and every archive the bundle ships, including
        # brew's openssl statics. A runner-image or bottle change that raises
        # it fails here. eco must load nothing from Homebrew (LLVM/MLIR and
        # OpenSSL are linked statically).
        run: |
          set -e
          min=15.0
          eco=/tmp/eco-bundle/bin/eco
          test/scripts/check-macho-floor.sh "$min" \
            "$eco" \
            build/compiler/build-kernel/bin/eco-compiler \
            /tmp/eco-smoke/hello \
            /tmp/eco-bundle/lib/eco-runtime/project/*.a
          if grep -n "built for newer" /tmp/eco-build.log; then
              echo "ERROR: a link mixed in objects built for a newer macOS than $min"
              exit 1
          fi
          echo "=== otool -L bin/eco ==="
          otool -L "$eco"
          if otool -L "$eco" | tail -n +2 \
              | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
              echo "ERROR: eco links a library outside macOS (expected static LLVM/MLIR/OpenSSL)"
              exit 1
          fi
          echo "=== otool -L hello ==="
          otool -L /tmp/eco-smoke/hello
          if otool -L /tmp/eco-smoke/hello | tail -n +2 \
              | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
              echo "ERROR: hello links a library outside macOS"
              exit 1
          fi
          echo "OK: macOS floor $min holds; eco and hello load only macOS libraries"

      - name: Save ccache (master only)
        # After the build/test steps, so it holds this run's objects; only on
        # master (see "Restore ccache").
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: mac-aot-ccache-${{ github.sha }}

      - name: Prune superseded ccache entries
        # Keep only the newest mac-aot-ccache-* entry on master (the one just saved):
        # restore-keys only ever reads the newest, and per-commit entries
        # otherwise pile up and push the LLVM caches out of the 10 GB limit.
        # Other refs save nothing, so they dry-run it instead: list what
        # master's prune would delete and check the token may delete caches.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.ref != 'refs/heads/master' && '1' || '' }}
        run: .github/scripts/prune-caches.sh mac-aot-ccache-

      - name: ccache stats
        if: always()
        run: ccache -s | head -15

      - name: Report outputs and timings
        if: always()
        run: |
          echo "=== bootstrap outputs ==="
          ls -la build/compiler/build-xhr/bin/ 2>/dev/null || true
          ls -la build/compiler/build-kernel/bin/ 2>/dev/null || true
          echo "=== stage timing logs ==="
          for f in build/compiler/build-kernel/timing-*.txt; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done

      - name: Upload AOT output + logs + bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-aot-output
          path: |
            build/compiler/build-kernel/bin/eco
            build/eco-*-darwin.tar.gz
            build/compiler/build-kernel/timing-*.txt
            /tmp/codesign.txt
            /tmp/help.txt
            /tmp/eco-build.log
            /tmp/test_output.txt
            /tmp/elm-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the Darwin bundle for bundle-smoke
        uses: actions/upload-artifact@v4
        with:
          name: mac-bundle
          path: build/eco-*-darwin.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Install the bundle on a fresh runner set up like a typical user's Mac:
  # Xcode Command Line Tools (the linker and SDK `eco make` needs), no Xcode
  # app, no Homebrew LLVM or OpenSSL, a clean HOME and a minimal PATH. The
  # runner is macos-15, the bundle's minimum macOS. eco make on a clean HOME
  # downloads and unpacks the packages itself, exercising eco's curl, zip/zlib
  # and OpenSSL code (plans/mac-self-contained-bundle.md step 2).
  bundle-smoke:
    needs: aot
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            compiler/examples
            test/scripts

      - uses: actions/download-artifact@v4
        with:
          name: mac-bundle
          path: dist

      - name: Hide Xcode and Homebrew's LLVM and OpenSSL
        run: |
          set -e
          sudo mkdir -p /opt/hidden
          for d in /Applications/Xcode*.app /opt/homebrew/opt/llvm* /opt/homebrew/opt/openssl* \
                   /opt/homebrew/Cellar/llvm* /opt/homebrew/Cellar/openssl*; do
              [ -e "$d" ] || continue
              echo "hiding $d"
              # Unique name per path: opt/llvm@18 and Cellar/llvm@18 clash.
              sudo mv "$d" "/opt/hidden/$(echo "$d" | tr / _)"
          done
          test -d /Library/Developer/CommandLineTools || {
              echo "ERROR: the runner has no Command Line Tools"; exit 1; }
          sudo xcode-select -s /Library/Developer/CommandLineTools
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDK: $sdk"
          case "$sdk" in
              /Library/Developer/CommandLineTools/*) ;;
              *) echo "ERROR: xcrun still resolves an Xcode SDK"; exit 1 ;;
          esac
          ls /opt/homebrew/opt 2>/dev/null | grep -iE '^(llvm|openssl)' && {
              echo "ERROR: Homebrew LLVM/OpenSSL still present"; exit 1; } || true

      - name: Install the bundle and build programs with it
        run: |
          set -e
          root="$RUNNER_TEMP/eco install"
          home="$RUNNER_TEMP/home"
          proj="$RUNNER_TEMP/project"
          mkdir -p "$root" "$home" "$proj/src"
          tar -xzf dist/eco-*-darwin.tar.gz -C "$root"
          eco=$(find "$root" -path '*/bin/eco' -type f | head -1)
          echo "eco: $eco"
          cp compiler/examples/elm.json "$proj/elm.json"
          cp compiler/examples/src/Hello.elm compiler/examples/src/Quotes.elm "$proj/src/"
          run() { env -i PATH=/usr/bin:/bin HOME="$home" "$@"; }

          run "$eco" --help | head -5
          cd "$proj"
          run "$eco" make src/Hello.elm --output=hello
          run "$eco" make src/Quotes.elm --output=quotes
          for p in hello quotes; do
              test -x "./$p" || { echo "ERROR: no $p executable"; exit 1; }
              # Browser-style programs exit non-zero headless; only a crash
              # (a signal) fails the smoke.
              set +e
              run "./$p" >/dev/null 2>&1
              rc=$?
              set -e
              if [ $rc -ge 128 ]; then echo "ERROR: $p crashed (rc=$rc)"; exit 1; fi
              echo "OK: $p ran (rc=$rc)"
          done

          echo "=== otool -L eco hello quotes ==="
          for f in "$eco" ./hello ./quotes; do
              otool -L "$f"
              if otool -L "$f" | tail -n +2 \
                  | grep -vE '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
                  echo "ERROR: $f links a library outside macOS"; exit 1
              fi
          done
          "$GITHUB_WORKSPACE"/test/scripts/check-macho-floor.sh 15.0 "$eco" ./hello ./quotes
          for f in hello quotes; do
              codesign -dv "./$f" 2>&1 | tee "/tmp/codesign-$f.txt"
              grep -q adhoc "/tmp/codesign-$f.txt" || { echo "ERROR: $f is not ad-hoc signed"; exit 1; }
          done
          echo "OK: the bundle installs and builds runnable programs with only the Command Line Tools"
