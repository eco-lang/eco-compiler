# Windows — single consolidated build: full bootstrap + every test gateway +
# the shippable Win64 distribution bundle, in one job.
#
# Replaces the former three-workflow split (win-bootstrap / win-runtime /
# win-aot). Windows has a single toolchain (the cached LLVM-MSVC install tree
# from win-llvm-build), so test-vs-ship need not be split. win-llvm-build
# stays as the LLVM base-image cache-warmer.
#
# Steps run cheap -> expensive (fail-fast):
#   1. front-end stages 1-5      (pure Node)                  — was win-bootstrap
#   2. elm-tests                 (compiler's own Elm suite)   — was win-bootstrap
#   3. JIT E2E (build + run test.exe)                         — was win-runtime
#   4. Stage 6-9 self-host chain (incl. 8c MLIR fixed point)  — was win-aot
#   5. verify PE -> package ZIP -> smoke-test bundle          — was win-aot
#
# stress / AOT-E2E stay Windows-gated-off (NOT WIN32) as in the runtime suite.
name: win-aot

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'compiler/**'
      - 'runtime/**'
      - 'elm-kernel-cpp/**'
      - 'eco-kernel-cpp/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'version.txt'
      - '.github/workflows/win-aot.yml'
  workflow_dispatch:
  schedule:
    # Daily build keeps the LLVM-MSVC install-tree cache accessed (a restore
    # resets GitHub's 7-day eviction timer). Inert until merged to master.
    - cron: '40 6 * * *'

jobs:
  aot:
    runs-on: windows-latest
    # Actual wall-clock is ~60 min (Stage 6 ~9m + Stage 7 ~15m + Stage 8/9
    # ~22m + the JIT gateway ~6m); 240 leaves ample headroom under the 6h cap.
    timeout-minutes: 240
    env:
      LLVM_DIR: ${{ github.workspace }}\experiments\win-llvm-build\out\llvm-install
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        # clang-cl is pinned in the win presets; it needs the MSVC headers/libs
        # to satisfy CMake's compiler probe. ilammy/msvc-dev-cmd sources
        # vcvarsall x64 (also provides ml64/link/lib for the AOT link line).
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore LLVM 21.1.8 install tree (from win-llvm-build / E-W3)
        # fail-on-cache-miss: the LLVM source build is the job of win-llvm-build
        # (kept warm by the daily schedule). A cold cache fails fast and
        # legibly — re-run win-llvm-build — rather than silently degrading.
        uses: actions/cache@v4
        with:
          path: experiments/win-llvm-build/out/llvm-install
          key: llvm-mlir-21.1.8-x86_64-pc-windows-msvc-x86-release-mt-v1
          fail-on-cache-miss: true

      - name: Install pnpm
        run: npm install -g pnpm
        shell: pwsh

      - name: Install rapidcheck (configure-time dep of ecor)
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/emil-e/rapidcheck.git $env:RUNNER_TEMP\rapidcheck
          cmake -S $env:RUNNER_TEMP\rapidcheck -B $env:RUNNER_TEMP\rapidcheck\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\rapidcheck-install"
          cmake --build $env:RUNNER_TEMP\rapidcheck\build --target install
          echo "rapidcheck_DIR=$env:RUNNER_TEMP\rapidcheck-install\share\rapidcheck\cmake" >> $env:GITHUB_ENV

      - name: Tool versions
        shell: pwsh
        run: |
          node --version
          pnpm --version
          (cmake --version | Select-Object -First 1)
          ninja --version
          Write-Host "CPUs: $env:NUMBER_OF_PROCESSORS"
          (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB

      - name: Configure (win-build preset)
        shell: pwsh
        run: cmake --preset win-build

      # ---- Gateway 1: front-end (stages 1-5). Pure Node — fails fast. ----
      - name: Stages 1-4b (guida.js -> JS fixed point)
        shell: pwsh
        run: cmake --build build --target eco-boot-verify

      - name: Stage 5 (eco-boot-2.js -> eco-compiler.mlir)
        shell: pwsh
        run: cmake --build build --target eco-compiler-mlir

      # ---- Gateway 2: the compiler's own Elm test suite. ----
      - name: elm-tests (compiler's Elm suite via win elm-test-rs)
        shell: pwsh
        # elm-test-rs 3.0.1 exits 2 ("INCOMPLETE") for the one intentional
        # Test.skip in compiler/tests/, even with zero actual failures. Accept
        # iff the captured log proves nothing failed.
        run: |
          $log = "$env:RUNNER_TEMP\elm-tests.log"
          $proc = Start-Process -FilePath cmake `
              -ArgumentList @('--build','build','--target','elm-tests') `
              -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $rc = $proc.ExitCode
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Write-Host
          if ($rc -eq 0) { Write-Host "OK: elm-tests passed (no skips)"; exit 0 }
          if ($rc -eq 2 -and (Select-String -Path $log -Pattern 'Failed: +0' -Quiet)) {
              Write-Host "OK: elm-tests passed (Test.skip incomplete, no failures)"
              exit 0
          }
          Write-Host "ERROR: elm-tests failed (rc=$rc)"; exit $rc

      # ---- Gateway 3: JIT E2E. Builds the runtime + kernels + test harness
      #      and runs the (partially Win-stubbed) JIT suite. ----
      - name: Build everything (-k 20 batches errors)
        shell: pwsh
        run: cmake --build build -- -k 20

      - name: Build test binary
        # test/ is wired on Windows: ElmE2EBase's fork-based runner has an
        # in-process serial fallback (#if defined(_WIN32)), popen->_popen, and
        # the elm-http + eco-kernel E2E suites are stubbed (TestHttpServer
        # depends on OpenSSL + BSD sockets). stress / mlir-equivalence /
        # aot-e2e-runner stay gated behind NOT WIN32.
        shell: pwsh
        run: cmake --build build --target test -- -k 20

      - name: Run JIT E2E tests
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\test_output.txt"
          $proc = Start-Process -FilePath build\test\test.exe `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $rc = $proc.ExitCode
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host
          exit $rc

      # ---- Gateway 4: the full Stage 6-9 self-host chain. Split into
      #      separately-timed steps so the Actions UI shows per-stage
      #      durations. eco-boot-native + the runtime are already built above. ----
      - name: Build eco-boot-native + project archives
        shell: pwsh
        run: cmake --build build --target eco-boot-native -- -k 20

      - name: Stage 6 — eco-compiler.exe (Win64 PE)
        # eco-boot-native lowers Stage 5's eco-compiler.mlir to a real Win64 PE
        # via clang-cl + lld-link with the full /MT static-CRT link line.
        shell: pwsh
        run: cmake --build build --target eco-compiler -- -k 20

      - name: Verify PE output (Stage 6 eco-compiler.exe)
        shell: pwsh
        run: |
          $eco = "build\compiler\build-kernel\bin\eco-compiler.exe"
          if (-not (Test-Path $eco)) { Write-Host "ERROR: $eco not built"; exit 1 }
          Write-Host "=== file metadata ==="
          Get-ChildItem $eco | Format-List
          Write-Host "=== PE header sanity (llvm-readobj) ==="
          & "$env:LLVM_DIR\bin\llvm-readobj.exe" --file-headers $eco | Select-String -Pattern 'Machine|Magic|Subsystem' | Write-Host
          Write-Host "OK: Stage 6 AOT-produced eco-compiler.exe is a valid Win64 PE"

      - name: Stage 7 — self-hosted compile + link
        # Stage 7a runs eco-compiler.exe to recompile compiler/src/Main.elm
        # into eco-compiler-boot.mlir; Stage 7b lowers that back to a Win64 PE.
        shell: pwsh
        run: cmake --build build --target eco-compiler-boot -- -k 20

      - name: Stage 8 + 9a — fixed point + lower for the unified binary
        # `--target eco` transitively depends on the BOOTSTRAP_STAMP (Stage 8c
        # MLIR byte-equality, pulling Stage 8a self-compile + 8b link), plus
        # Stage 9a (eco-compiler.mlir -> eco-stage9.o) then Stage 9b (link the
        # unified eco.exe).
        shell: pwsh
        run: cmake --build build --target eco -- -k 20

      - name: Verify PE output (Stage 9 unified eco.exe)
        shell: pwsh
        run: |
          $eco = "build\compiler\build-kernel\bin\eco.exe"
          if (-not (Test-Path $eco)) { Write-Host "ERROR: $eco not built"; exit 1 }
          Write-Host "=== file metadata ==="
          Get-ChildItem $eco | Format-List
          Write-Host "=== PE header sanity (llvm-readobj) ==="
          & "$env:LLVM_DIR\bin\llvm-readobj.exe" --file-headers $eco | Select-String -Pattern 'Machine|Magic|Subsystem' | Write-Host
          Write-Host "OK: Stage 9 AOT-produced eco.exe is a valid Win64 PE"

      # ---- Ship: package + smoke-test the Windows bundle in isolation. ----
      - name: Package Windows bundle (ZIP)
        # CPack picks up the BundleWindows component from CMakeLists.txt's
        # elseif(WIN32 ...) install block — eco.exe, eco-compiler.exe, project
        # archives (.lib), vendored libcurl_static + zip + zlibstatic, kernel
        # sources, examples.
        shell: pwsh
        run: |
          cmake --build build --target package -- -k 20
          Get-ChildItem build\eco-*.zip | Format-List

      - name: Smoke-test the bundle in isolation
        # Extract the ZIP to a fresh prefix and probe bin/eco.exe (the unified
        # Stage 9 binary). Confirms the bundle is self-contained.
        shell: pwsh
        run: |
          $bundle = Get-ChildItem build\eco-*.zip | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP\eco-bundle"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $bundle.FullName -DestinationPath $dest -Force
          # CPack ZIP under CPACK_ARCHIVE_COMPONENT_INSTALL=ON drops bin/, lib/,
          # share/ straight at the archive root (no enclosing eco-VERSION-…/
          # folder, unlike the Darwin TGZ). Detect both layouts.
          if (Test-Path "$dest\bin") {
              $root = $dest
          } else {
              $root = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          }
          Write-Host "=== bundle root: $root ==="
          Write-Host "=== bin/ ==="
          Get-ChildItem "$root\bin" | Format-Table Name, Length
          Write-Host "=== lib/eco-runtime/project/ ==="
          Get-ChildItem "$root\lib\eco-runtime\project" | Format-Table Name, Length
          Write-Host "=== share/eco/kernel/ (first 20) ==="
          Get-ChildItem "$root\share\eco\kernel" -Recurse | Select-Object -First 20 | Format-Table FullName
          Write-Host "=== share/eco/examples/ ==="
          Get-ChildItem "$root\share\eco\examples" -Recurse | Format-Table FullName
          $ecoBin = "$root\bin\eco.exe"
          if (-not (Test-Path $ecoBin)) {
              Write-Host "ERROR: bundle missing bin/eco.exe"; exit 1
          }
          Write-Host "=== smoke run: eco --help ==="
          $log = "$env:RUNNER_TEMP\help.txt"
          $proc = Start-Process -FilePath $ecoBin -ArgumentList '--help' `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $rc = $proc.ExitCode
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -First 20 | Write-Host
          if ($rc -lt 0 -or $rc -eq 0xC0000005 -or $rc -eq 0xC0000409) {
              Write-Host "ERROR: bundled eco --help crashed with rc=$rc"; exit 1
          }
          Write-Host "OK: bundled eco.exe runs in isolation"

      - name: Upload AOT output + bundle + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-aot-output
          path: |
            build/compiler/build-kernel/bin/eco.exe
            build/compiler/build-kernel/bin/eco-compiler.exe
            build/eco-*.zip
            ${{ runner.temp }}/help.txt
            ${{ runner.temp }}/help.txt.err
            ${{ runner.temp }}/test_output.txt
            ${{ runner.temp }}/elm-tests.log
          if-no-files-found: warn
          retention-days: 7
