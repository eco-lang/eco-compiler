# E-W2 from plans/build-on-windows.md: JIT-frame registration via
# RtlAddFunctionTable + heap-model micro-tests (VirtualAlloc reserve 64 GiB,
# commit sparsely, decommit, release). No eco code, no llc. ~3 runner-min.
name: win-jit-smoke

on:
  push:
    branches: ['ci/**']
    paths:
      - 'experiments/win-jit-smoke/**'
      - '.github/workflows/win-jit-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run jit-frame + heap smoke
        shell: pwsh
        run: experiments/win-jit-smoke/run.ps1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-jit-smoke-out
          path: experiments/win-jit-smoke/out/
