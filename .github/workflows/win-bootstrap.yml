# E-W4 from plans/build-on-windows.md: eco front-end configure + bootstrap
# stages 1-5 on Windows x86_64, using the toolchain.cmake Windows branch
# (elm / elm-format / elm-test-rs Windows prebuilts) and the ECO_FRONTEND_ONLY
# configure mode (no LLVM/MLIR, runtime, kernels or tests).
#
# Stage 1: stock elm (win64 prebuilt) compiles the compiler → guida.js
# Stages 2-4b: JS self-compilation chain + JS fixed-point check
# Stage 5: eco-boot-2.js emits eco-compiler.mlir
# elm-tests: elm-test-rs runs the compiler's tests/ suite
name: win-bootstrap

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'compiler/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/win-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        # clang-cl is pinned in the win-frontend preset (so a stray MinGW
        # doesn't get picked up); clang-cl in turn needs the MSVC headers
        # + libs to satisfy CMake's compiler-probe step. ilammy/msvc-dev-cmd
        # sources vcvarsall x64 — same action E-W3 uses for its LLVM build.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pnpm
        # node is preinstalled; pnpm is not.
        run: npm install -g pnpm
        shell: pwsh

      - name: Tool versions
        shell: pwsh
        run: |
          node --version
          pnpm --version
          (cmake --version | Select-Object -First 1)
          ninja --version
          Write-Host "CPUs: $env:NUMBER_OF_PROCESSORS"
          (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB

      - name: Configure (front-end only)
        shell: pwsh
        run: cmake --preset win-frontend

      - name: Stages 1-4b (guida.js → JS fixed point)
        shell: pwsh
        run: cmake --build build --target eco-boot-verify

      - name: Stage 5 (eco-boot-2.js → eco-compiler.mlir)
        shell: pwsh
        run: cmake --build build --target eco-compiler-mlir

      - name: elm-tests (compiler's Elm test suite via win elm-test-rs)
        shell: pwsh
        # Same exit-code dance as mac-bootstrap.yml: elm-test-rs 3.0.1 exits
        # 2 ("INCOMPLETE") for the compiler/tests/ suite's one intentional
        # Test.skip, even with zero actual failures.
        run: |
          $log = "$env:RUNNER_TEMP\elm-tests.log"
          $proc = Start-Process -FilePath cmake `
              -ArgumentList @('--build','build','--target','elm-tests') `
              -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $rc = $proc.ExitCode
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Write-Host
          if ($rc -eq 0) { Write-Host "OK: elm-tests passed (no skips)"; exit 0 }
          if ($rc -eq 2 -and (Select-String -Path $log -Pattern 'Failed: +0' -Quiet)) {
              Write-Host "OK: elm-tests passed (Test.skip incomplete, no failures)"
              exit 0
          }
          Write-Host "ERROR: elm-tests failed (rc=$rc)"; exit $rc

      - name: Report outputs and timings
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== bootstrap outputs ==="
          Get-ChildItem build\compiler\build-xhr\bin\ -ErrorAction SilentlyContinue
          Get-ChildItem build\compiler\build-kernel\bin\ -ErrorAction SilentlyContinue
          Write-Host "=== stage timing logs ==="
          Get-ChildItem build\compiler\build-kernel\timing-*.txt -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content $_.FullName
          }
          Write-Host "=== eco-compiler.mlir size ==="
          Get-ChildItem build\compiler\build-kernel\bin\*.mlir -ErrorAction SilentlyContinue |
              Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-bootstrap-logs
          path: |
            build/compiler/build-kernel/timing-*.txt
            build/compiler/build-kernel/*.stamp
            build/compiler/build-xhr/*.stamp
          if-no-files-found: warn
