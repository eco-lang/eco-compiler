# E-W5 from plans/build-on-windows.md: full runtime + kernels + JIT E2E on
# Windows x86_64. Restores the LLVM 21.1.8 + MLIR install tree built by
# win-llvm-build (E-W3), configures with the win-build preset, and runs the
# JIT E2E suite. -k 20 batches compile errors so each iteration reports many.
#
# This workflow EXPECTS the LLVM install-tree cache from E-W3 to be present;
# if it isn't, the configure step fails fast with "MLIR not found".
name: win-runtime

on:
  push:
    branches: ['ci/**']
    paths:
      - 'runtime/**'
      - 'elm-kernel-cpp/**'
      - 'eco-kernel-cpp/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/win-runtime.yml'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      LLVM_DIR: ${{ github.workspace }}\experiments\win-llvm-build\out\llvm-install
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore LLVM 21.1.8 install tree (from win-llvm-build / E-W3)
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: experiments/win-llvm-build/out/llvm-install
          key: llvm-mlir-21.1.8-x86_64-pc-windows-msvc-x86-release-mt-v1
          fail-on-cache-miss: true

      - name: Install pnpm
        run: npm install -g pnpm
        shell: pwsh

      - name: Install rapidcheck
        # Not on Chocolatey — build from source. ~3 minutes on the runner.
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/emil-e/rapidcheck.git $env:RUNNER_TEMP\rapidcheck
          cmake -S $env:RUNNER_TEMP\rapidcheck -B $env:RUNNER_TEMP\rapidcheck\build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\rapidcheck-install"
          cmake --build $env:RUNNER_TEMP\rapidcheck\build --target install
          echo "rapidcheck_DIR=$env:RUNNER_TEMP\rapidcheck-install\share\rapidcheck\cmake" >> $env:GITHUB_ENV

      - name: Configure (win-build preset)
        shell: pwsh
        run: cmake --preset win-build

      - name: Build everything (-k 20 batches errors)
        shell: pwsh
        run: cmake --build build -- -k 20

      - name: Build test binary
        # test/ is now wired on Windows: ElmE2EBase's fork-based runner
        # has an in-process serial fallback (#if defined(_WIN32)),
        # IsolatedTestRunner does the same, popen→_popen, and the elm-http
        # + eco-kernel E2E suites are stubbed to return empty (TestHttpServer
        # depends on OpenSSL + BSD sockets). stress-test/mlir-equivalence/
        # aot-e2e-runner stay gated behind NOT WIN32.
        shell: pwsh
        run: cmake --build build --target test -- -k 20

      - name: Run JIT E2E tests
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\test_output.txt"
          $proc = Start-Process -FilePath build\test\test.exe `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $rc = $proc.ExitCode
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue | Select-Object -Last 30 | Write-Host
          exit $rc

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\ew5-logs | Out-Null
          Copy-Item -Path "$env:RUNNER_TEMP\test_output.txt" -Destination $env:RUNNER_TEMP\ew5-logs\ -ErrorAction SilentlyContinue
          Copy-Item -Path "$env:RUNNER_TEMP\test_output.txt.err" -Destination $env:RUNNER_TEMP\ew5-logs\ -ErrorAction SilentlyContinue
          Get-ChildItem $env:RUNNER_TEMP\ew5-logs\ | Format-List

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-runtime-logs
          path: ${{ runner.temp }}/ew5-logs/
          if-no-files-found: warn
