# E-M1 from plans/build-on-mac.md: statepoint/stackmap smoke test on
# macOS arm64. No eco build involved — answers the plan's confidence
# risks 1 (AArch64 stackmap details: x19 entries, slide/rebase, dead_strip)
# and the JIT-adjacent unwinder questions, in ~15 runner-minutes.
#
# Trigger: push to ci/** branches (the workflow file rides the branch —
# nothing needs to be on master). workflow_dispatch becomes usable once a
# copy of this file is merged to the default branch.
name: mac-statepoint-smoke

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 21 (bottle, includes MLIR)
        run: brew install llvm@21

      - name: Run statepoint smoke
        run: bash experiments/mac-statepoint-smoke/run.sh

      - name: Upload logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-statepoint-smoke-out
          path: experiments/mac-statepoint-smoke/out/
