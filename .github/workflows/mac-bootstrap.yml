# E-M2 + M5 from plans/build-on-mac.md: eco front-end configure +
# bootstrap stages 1–5 on macOS arm64, using the per-platform toolchain
# table in compiler/cmake/toolchain.cmake and the ECO_FRONTEND_ONLY
# configure mode (no LLVM/MLIR, runtime, kernels or tests involved).
# M5 adds the elm-test-rs suite over the same configure to prove the
# compiler's own Elm tests pass on the mac toolchain.
#
# Stage 1: stock elm (mac arm64 prebuilt) compiles the compiler → guida.js
# Stages 2–4b: JS self-compilation chain + JS fixed-point check
# Stage 5: eco-boot-2.js emits eco-compiler.mlir (GNU-time wrapped)
# elm-tests: elm-test-rs runs the compiler's tests/ suite
name: mac-bootstrap

on:
  push:
    branches: ['ci/**', 'master']
    paths:
      - 'compiler/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/mac-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and GNU time
        run: brew install pnpm gnu-time

      - name: Tool versions
        run: |
          node --version
          pnpm --version
          cmake --version | head -1
          ninja --version
          sysctl hw.memsize hw.ncpu

      - name: Configure (front-end only)
        run: cmake --preset mac-frontend

      - name: Stages 1-4b (guida.js -> JS fixed point)
        run: cmake --build build --target eco-boot-verify

      - name: Stage 5 (eco-boot-2.js -> eco-compiler.mlir)
        run: cmake --build build --target eco-compiler-mlir

      - name: elm-tests (compiler's Elm test suite via mac elm-test-rs)
        # M5 — the compiler's own Elm tests (compiler/tests/) driven by
        # the M1-fetched mac arm64 elm-test-rs prebuilt. Same configure
        # as the bootstrap steps above; only the target changes. Runs
        # AFTER Stage 5 so a Stage 5 regression doesn't get masked by
        # an earlier elm-tests failure.
        #
        # Exit code handling: elm-test-rs 3.0.1 exits 2 ("INCOMPLETE")
        # whenever a `Test.skip` appears in the suite, even if zero
        # tests actually failed. compiler/tests/ has one intentional
        # Test.skip (NoCEcoValueInUserFunctionsTest.elm) so the build
        # target's raw exit code is always 2 here. We accept that case
        # iff the captured log proves no test actually failed.
        run: |
          set +e
          cmake --build build --target elm-tests 2>&1 | tee /tmp/elm-tests.log
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then
              echo "OK: elm-tests passed (no skips)"; exit 0
          fi
          if [ $rc -eq 2 ] && grep -qE 'Failed: +0' /tmp/elm-tests.log; then
              echo "OK: elm-tests passed (Test.skip incomplete, no failures)"
              exit 0
          fi
          echo "ERROR: elm-tests failed (rc=$rc)"; exit $rc

      - name: Report outputs and timings
        if: always()
        run: |
          echo "=== bootstrap outputs ==="
          ls -la build/compiler/build-xhr/bin/ 2>/dev/null || true
          ls -la build/compiler/build-kernel/bin/ 2>/dev/null || true
          echo "=== stage timing logs ==="
          for f in build/compiler/build-kernel/timing-*.txt; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done
          echo "=== eco-compiler.mlir size ==="
          du -h build/compiler/build-kernel/bin/*.mlir 2>/dev/null || true

      - name: Collect logs for artifact
        if: always()
        run: |
          mkdir -p /tmp/em2-logs
          cp build/compiler/build-kernel/timing-*.txt /tmp/em2-logs/ 2>/dev/null || true
          find build/compiler -maxdepth 2 -name '*.stamp' -type f \
            -exec cp {} /tmp/em2-logs/ \; 2>/dev/null || true
          ls -la /tmp/em2-logs/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-bootstrap-logs
          path: /tmp/em2-logs/
          if-no-files-found: warn
