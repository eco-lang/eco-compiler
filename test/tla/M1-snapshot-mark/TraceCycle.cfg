    Obj = {1, 2, 3, 4}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {}
    InitAlloc <- TC_Alloc
    InitGen <- TC_Gen
    InitAge <- TC_Age
    InitFld <- TC_Fld
    InitRoot <- TC_Root
    InitCell <- TC_Cell
    T <- TC_T
    MaxMinors <- TC_MaxMinors
    MaxMajors <- TC_MaxMajors
    MaxOps = 0
    MaxTotalOps = 0
    Ops = {}
    AssistMax = 4
    MaxStops <- TC_MaxStops
    SyncMark = FALSE
    RegionMode = FALSE
    MUTANT = "none"
INIT TraceInit
NEXT TraceNext
INVARIANT TLUnmatched
CHECK_DEADLOCK FALSE
