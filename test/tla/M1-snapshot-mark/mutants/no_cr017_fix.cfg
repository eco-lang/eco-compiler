\* M1 mutant no_cr017_fix: MC_quick_region with the code BEFORE CR-017's fix (a region-mode STW
\* major does not zap the dead survivors it did not reach). Expected: violates MarkerFootprint
\* (CR-017: the t0 walk greys an old cell a STW major freed through a dead hand-over object).
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 1
    MaxOps = 2
    MaxTotalOps = 2
    Ops <- OpKinds
    AssistMax = 1
    MaxStops = 1
    SyncMark = FALSE
    RegionMode = TRUE
    MUTANT = "no_cr017_fix"
SPECIFICATION Spec
INVARIANTS
    MarkerFootprint
CHECK_DEADLOCK FALSE
