\* M1 mutant defer_released (ABA audit, 2026-09-29): a dead young large object is released
\* at the minor but kept on the deferred list, so the handoff frees whatever occupies its id
\* by then (the code keeps a deferred cell allocated until processDeferredFrees).
\* Story: t0; alloc YLOS 5; drop it; minor: 5 deferred and released; alloc 5 again (live);
\* handoff frees 5. Expected: violates NoLostObject. Only the story's operations are enabled.
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 0
    MaxOps = 2
    MaxTotalOps = 3
    Ops = {"alloc", "drop"}
    AssistMax = 1
    MaxStops = 0
    SyncMark = FALSE
    RegionMode = FALSE
    MUTANT = "defer_released"
SPECIFICATION Spec
INVARIANTS
    NoLostObject
CHECK_DEADLOCK FALSE
