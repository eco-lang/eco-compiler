\* M1 mutant closing_never: the step at k >= T never runs the closing join, so a cycle
\* need not end. Expected: violates the temporal property CycleEnds.
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 1
    MaxOps = 2
    MaxTotalOps = 1
    Ops <- OpKinds
    AssistMax = 1
    MaxStops = 1
    SyncMark = FALSE
    RegionMode = FALSE
    MUTANT = "closing_never"
SPECIFICATION LiveSpec
PROPERTY CycleEnds
CHECK_DEADLOCK FALSE
