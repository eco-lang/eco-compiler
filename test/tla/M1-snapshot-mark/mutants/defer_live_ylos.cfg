\* M1 mutant defer_live_ylos: sweepNurseryLargeBodies misjudges liveness and defers a young large
\* object that the minor reached (its cell is then freed at the handoff).
\* Expected: violates DeferredOK (IM8, model form). Only the operations the story needs are enabled.
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 0
    MaxOps = 2
    MaxTotalOps = 2
    Ops = {"alloc", "drop"}
    AssistMax = 1
    MaxStops = 0
    SyncMark = FALSE
    RegionMode = FALSE
    MUTANT = "defer_live_ylos"
SPECIFICATION Spec
INVARIANTS
    DeferredOK
CHECK_DEADLOCK FALSE
