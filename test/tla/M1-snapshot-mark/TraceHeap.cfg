\* M1 trace (b), the tiny graph (TraceHeap.tla). Accepted iff TLC reports
\* "Invariant TPUnmatched is violated" (a behaviour matched the whole log).
\* Obj is 1..8: tiny_graph.cpp's kMaxId (the header's maxid).
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5, 6, 7, 8}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {}
    InitAlloc <- TH_Alloc
    InitGen <- TH_Gen
    InitAge <- TH_Age
    InitFld <- TH_Fld
    InitRoot <- TH_Root
    InitCell <- TH_Cell
    T <- TH_T
    MaxMinors <- TH_MaxMinors
    MaxMajors <- TH_MaxMajors
    MaxOps <- TH_MaxOps
    MaxTotalOps <- TH_MaxOps
    Ops = {"load", "drop", "cellw", "cellr", "alloc"}
    AssistMax = 8
    MaxStops <- TH_MaxStops
    SyncMark = FALSE
    RegionMode = FALSE
    MUTANT = "none"
INIT TraceInit
NEXT TraceNext
INVARIANT TPUnmatched
CHECK_DEADLOCK FALSE
