\* M1 quick_region_reuse (ABA audit, 2026-09-29): CR-017 plus reuse. Region mode, one STW
\* major, and the old cell 4 may be reallocated at the same id by a young large object
\* (YlosIds = {4, 5}). Story: the major frees 4 under the dead hand-over object 3; the t0
\* walk greys 4 (CR-017); the mutator reallocates 4 as a YLOS whose field is young before a
\* marker pops the stale entry, so the marker would scan a young-pointing object (the
\* every-build abort in greyObject / scanObject). Only the story's operations are enabled.
\* Expected: pass (every invariant; CR-017 fixed 2026-09-30, HEAP_074: the major zaps 3, so t0
\* never greys 4). It violated MarkerNoYoungKid before; that code is mutants/no_cr017_fix_reuse.
