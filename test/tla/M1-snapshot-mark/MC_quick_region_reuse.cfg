    RegionMode = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    NoLostObject
    IM1
    IM2
    IM9
    MarkerFootprint
    MarkerNoYoungKid
    NoReleaseInCycle
    NoOldToYoung
    SnapshotClosure
