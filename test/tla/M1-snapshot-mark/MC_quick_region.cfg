\* M1 quick_region: region mode with a STW major. Expected: violates MarkerFootprint
\* (CR-017: the t0 walk greys an old cell a STW major freed through a dead hand-over object).
\* Flips to "pass" (all nine invariants) in the change that fixes CR-017.
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 1
    MaxOps = 2
    MaxTotalOps = 2
    Ops <- OpKinds
    AssistMax = 1
    MaxStops = 1
    SyncMark = FALSE
    RegionMode = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    MarkerFootprint
CHECK_DEADLOCK FALSE
