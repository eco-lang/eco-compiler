\* M1 quick_region: region mode with a STW major. Expected: pass (every invariant). Until CR-017's
\* fix (2026-09-30, HEAP_074: the major zaps the dead survivors it did not reach) it violated
\* MarkerFootprint: the t0 walk greyed an old cell a STW major freed through a dead hand-over
\* object. The pre-fix code is the mutant mutants/no_cr017_fix.
CONSTANTS
    Nil = Nil
    Obj = {1, 2, 3, 4, 5}
    RootSlots = {"r1", "r2"}
    CellSlots = {"c1"}
    Fields = {1}
    YlosIds = {5}
    InitAlloc <- MC_Alloc
    InitGen <- MC_Gen
    InitAge <- MC_Age
    InitFld <- MC_Fld
    InitRoot <- MC_Root
    InitCell <- MC_Cell
    T = 2
    MaxMinors = 4
    MaxMajors = 1
    MaxOps = 2
    MaxTotalOps = 2
    Ops <- OpKinds
    AssistMax = 1
    MaxStops = 1
    SyncMark = FALSE
    RegionMode = TRUE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    NoLostObject
    IM1
    IM2
    IM9
    MarkerFootprint
    MarkerNoYoungKid
    NoReleaseInCycle
    NoOldToYoung
    SnapshotClosure
    DeferredOK
CHECK_DEADLOCK FALSE
