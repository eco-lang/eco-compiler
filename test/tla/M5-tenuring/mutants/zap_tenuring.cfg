\* M5 mutant zap_tenuring: MC_cycle_major, but the STW major also zaps the Tenuring extent's unreached
\* objects. The major reaches a merged job's extent only through its copies (majorRedirect), so its
\* forwarded originals, still named by roots and slots until the next minor's resolveRetire, are
\* zapped. Expected: violates NoDangling (why HEAP_074 never zaps the Tenuring extent).
CONSTANTS
    K = 1
    EC = 2
    SC = 2
    BC = 0
    OC = 4
    YC = 0
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 1
    MaxMinors = 3
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop"}
    TenureMode = 1
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "identity"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "zap_tenuring"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TV1_Resolve
    NoDangling
CHECK_DEADLOCK FALSE
