\* M5 trace validation (TraceTenuring.tla). Accepted iff TLC reports
\* "Invariant TPUnmatched is violated" (a behaviour matched the whole log).
\* The heap sizes, the field count and the generation bound come from the log's header.
CONSTANTS
    K = 1
    EC = 1
    SC <- TT_SC
    BC = 0
    OC <- TT_OC
    YC <- TT_YC
    NF <- TT_NF
    Roots <- TT_Roots
    MaxLid = 1
    OldSeed = 0
    MaxMinors = 1
    MaxMajors = 0
    MaxTotalOps = 0
    Ops = {}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = FALSE
    CycleAllowed = FALSE
    CycleT = 1
    GenMod <- TT_GenMod
    StopAllowed = FALSE
    YlosGen = "identity"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
INIT TraceInit
NEXT TraceNext
INVARIANT TPUnmatched
CHECK_DEADLOCK FALSE
