\* M5 ylos_aba: quick_ylos_major with the address-keyed ylos_gen of the code BEFORE HEAP_072
\* (YlosGen = "addr"; the regression mutant of CR-034's fix, whose row is controls/ylos_stamp). Expected:
\* violates YlosGenIdentity (CR-034: a STW major frees generation member A, a new YLOS B is
\* allocated at A's address, and the next hand-over prep takes B for a member). Fixed by HEAP_072
\* (2026-09-29): YlosGen = "stamp" passes (controls/ylos_stamp).
CONSTANTS
    K = 1
    EC = 2
    SC = 2
    BC = 0
    OC = 4
    YC = 2
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 0
    MaxMinors = 3
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc"}
    TenureMode = 1
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = FALSE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "addr"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    YlosGenIdentity
CHECK_DEADLOCK FALSE
