\* M5 k2_ylos_aba: tenure age k = 2 with generation YLOS and a STW major, the address-keyed ylos_gen
\* of the code BEFORE HEAP_072 (YlosGen = "addr"; the regression mutant of CR-034's fix, whose row is
\* controls/ylos_stamp_k2). Expected: violates NoDangling (CR-034 through the ageing prep:
\* the new YLOS B at a freed member's address is taken for an ageing member, which the pause records
\* but does not scan (reachYoungLargeR's age branch), so B's eden child is never evacuated and B
\* dangles into eden at the end of that minor). Fixed by HEAP_072 (NurseryRegion.cpp:780).
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 3
    YC = 1
    NF = 1
    Roots = {1, 2}
    MaxLid = 3
    OldSeed = 0
    MaxMinors = 4
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = FALSE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "addr"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoDangling
CHECK_DEADLOCK FALSE
