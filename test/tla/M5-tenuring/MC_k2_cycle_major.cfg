\* M5 k2_cycle_major: quick_k2 plus a STW major. Expected: violates YoungWalkValid (CR-017 with
\* tenure age k = 2: 07b's zap removes only objects dead at a job's mark; an object of an ageing
\* extent that died since, or before the extent's first mark, is walked at the next t0).
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 3
    YC = 0
    NF = 1
    Roots = {1, 2}
    MaxLid = 3
    OldSeed = 0
    MaxMinors = 5
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "identity"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    YoungWalkValid
CHECK_DEADLOCK FALSE
