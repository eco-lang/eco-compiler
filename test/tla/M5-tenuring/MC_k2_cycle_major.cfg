\* M5 k2_cycle_major: quick_k2 plus a STW major. Expected: pass (every invariant). Until CR-017's fix
\* (HEAP_074) it violated YoungWalkValid (tenure age k = 2: 07b's zap removes only objects dead at a
\* job's mark; an object of an ageing extent that died since, or before the extent's first mark, was
\* walked at the next t0). Pre-fix code: mutants/no_cr017_fix_k2; the age-1-only zap: zap_fresh_only.
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 3
    YC = 0
    NF = 1
    Roots = {1, 2}
    MaxLid = 3
    OldSeed = 0
    MaxMinors = 5
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "identity"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoDangling
    GraphPreserved
    CollectorPrivate
    ExactlyOnce
    OldPointsOld
    HealYoungOnly
    MarkerDisjoint
    YoungWalkValid
    T0GreyAllocated
    TenuredEqualsLegacy
    TV1_Heal
    TV1_Resolve
    TV1_Major
    TV1_Ylos
    BuilderYoung
    YlosFreed
