\* M5 deep_boundary: the STW major x region-nursery boundary at k = 1, all at once: builders, generation
\* YLOS, large bodies, STW majors, mark cycles, the address-keyed lists, mode 2, stops. CR-034 is looked
\* past with the never-reused stamp and the kind check, CR-017 with the model-only oracle walk (the
\* _cr017 / _cr034 rows: the same bounds with the code). Expected: pass; any violation is new.
CONSTANTS
    K = 1
    EC = 2
    SC = 3
    BC = 1
    OC = 4
    YC = 2
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 0
    MaxMinors = 4
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc", "lalloc", "balloc", "bwrite", "bclear"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = TRUE
    YlosGen = "stamp"
    Cr017Oracle = TRUE
    LbKey = "kind"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoDangling
    GraphPreserved
    CollectorPrivate
    ExactlyOnce
    OldPointsOld
    HealYoungOnly
    MarkerDisjoint
    YoungWalkValid
    T0GreyAllocated
    TenuredEqualsLegacy
    TV1_Heal
    TV1_Resolve
    TV1_Major
    TV1_Ylos
    BuilderYoung
    YlosFreed
    YlosGenIdentity
CHECK_DEADLOCK TRUE
