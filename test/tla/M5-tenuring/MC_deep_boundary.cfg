\* M5 deep_boundary: the STW major x region-nursery boundary at k = 1, all at once: builders, generation
\* YLOS, large bodies, STW majors, mark cycles, the address-keyed lists, mode 2, stops. CR-034 is fixed in
\* the code by the stamp (HEAP_072, YlosGen = "stamp"), CR-037 by the kind check (LbKey = "kind", the code
\* since 2026-09-30) and CR-017 by the major's zap (HEAP_074; the model-only oracle walk is off since
\* then). The _cr017 row: the same bounds with the pre-HEAP_074 code; the _cr034 row: the pre-HEAP_072
\* code. Expected: pass; any violation is new.
CONSTANTS
    K = 1
    EC = 2
    SC = 3
    BC = 1
    OC = 4
    YC = 2
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 0
    MaxMinors = 4
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc", "lalloc", "balloc", "bwrite", "bclear"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = TRUE
    YlosGen = "stamp"
    Cr017Oracle = FALSE
    LbKey = "kind"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoDangling
    GraphPreserved
    CollectorPrivate
    ExactlyOnce
    OldPointsOld
    HealYoungOnly
    MarkerDisjoint
    YoungWalkValid
    T0GreyAllocated
    TenuredEqualsLegacy
    TV1_Heal
