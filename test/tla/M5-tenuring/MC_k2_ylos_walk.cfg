\* M5 k2_ylos_walk: tenure age k = 2 with generation YLOS and mark cycles, no STW major. Expected:
\* violates YoungWalkValid (found 2026-09-29: a YLOS of generation G_m dies before its generation's
\* ageing mark, so its slot into G_{m-1} is never healed; G_{m-1} retires, and the next t0's
\* snapshotYoungLarge reads the slot. 07b's zap covers dead ageing survivor objects only. The target
\* is young, which the snapshot drops by range (greyObject), so T0GreyAllocated holds).
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 3
    YC = 1
    NF = 1
    Roots = {1, 2}
    MaxLid = 3
    OldSeed = 0
    MaxMinors = 5
    MaxMajors = 0
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = FALSE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "identity"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    YoungWalkValid
CHECK_DEADLOCK FALSE
