\* M5 control (CR-034 fix candidate 2 with the LargeBodyId as the stamp): quick_ylos_major. The major's
\* release pushes the freed member's id on free_large_body_ids_ and the next registration pops it
\* (LIFO), so the new YLOS can carry the same id. Expected: violates YlosGenIdentity.
CONSTANTS
    K = 1
    EC = 2
    SC = 2
    BC = 0
    OC = 4
    YC = 2
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 0
    MaxMinors = 3
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc"}
    TenureMode = 1
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = FALSE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "lbid"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    YlosGenIdentity
CHECK_DEADLOCK FALSE
