\* M5 control: the age >= 1 check at k = 2. Expected: violates YlosGenIdentity (the new YLOS B is
\* skipped at the ageing prep while it has age 0, joins the next fill's generation (age 1), and the
\* freed member's extent then claims it at its hand-over prep: the check is not enough at k >= 2).
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 3
    YC = 1
    NF = 1
    Roots = {1, 2}
    MaxLid = 3
    OldSeed = 0
    MaxMinors = 4
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = FALSE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "age1"
    Cr017Oracle = FALSE
    LbKey = "identity"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    YlosGenIdentity
CHECK_DEADLOCK FALSE
