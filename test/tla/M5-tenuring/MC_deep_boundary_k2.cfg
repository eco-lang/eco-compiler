\* M5 deep_boundary_k2: the STW major x region-nursery boundary, all at once: tenure age k = 2,
\* generation YLOS, large bodies, STW majors, mark cycles, the address-keyed ylos_gen and lb_bodies
\* lists, mode 2; the smallest bounds that admit CR-017's k = 2 chain and CR-034's chains (the _cr017
\* and _lb rows: the same bounds with the pre-HEAP_074 / pre-CR-037 code; _cr034: the pre-HEAP_072 code).
\* YlosGen = "stamp" (HEAP_072), LbKey = "kind" (CR-037) and the major's zap (HEAP_074, CR-017; the
\* model-only oracle walk is off since 2026-09-30) are the code, and so is CR-038's merge clearing of
\* dead ageing-generation YLOS slots (HEAP_070 amended), so YoungWalkValid is checked again.
\* Expected: pass; any violation is new.
