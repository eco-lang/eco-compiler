\* M5 deep_boundary_k2: the STW major x region-nursery boundary, all at once: tenure age k = 2,
\* generation YLOS, large bodies, STW majors, mark cycles, the address-keyed ylos_gen and lb_bodies
\* lists, mode 2; the smallest bounds that admit CR-017's k = 2 chain and CR-034's chains (the _cr017,
\* _cr034 and _lb rows: the same bounds with the code). The known defects are looked past: CR-034 with
\* the never-reused stamp (YlosGen = "stamp") and the kind check (LbKey = "kind"), CR-017 with the
\* model-only oracle walk, and the k = 2 YLOS walk gap (MC_k2_ylos_walk) by checking T0GreyAllocated
\* instead of YoungWalkValid. Expected: pass; any violation is new.
CONSTANTS
    K = 2
    EC = 1
    SC = 1
    BC = 0
    OC = 4
    YC = 1
    NF = 1
    Roots = {1, 2}
    MaxLid = 4
    OldSeed = 0
    MaxMinors = 5
    MaxMajors = 1
    MaxTotalOps = 3
    Ops = {"alloc", "load", "drop", "yalloc", "lalloc"}
    TenureMode = 2
    Collectors = 1
    HelpAllowed = TRUE
    MajorAllowed = TRUE
    CycleAllowed = TRUE
    CycleT = 1
    GenMod = 8
    StopAllowed = FALSE
    YlosGen = "stamp"
    Cr017Oracle = TRUE
    LbKey = "kind"
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoDangling
    GraphPreserved
    CollectorPrivate
    ExactlyOnce
    OldPointsOld
    HealYoungOnly
    MarkerDisjoint
    T0GreyAllocated
    TenuredEqualsLegacy
    TV1_Heal
    TV1_Resolve
    TV1_Major
    TV1_Ylos
    BuilderYoung
    YlosFreed
    YlosGenIdentity
CHECK_DEADLOCK TRUE
