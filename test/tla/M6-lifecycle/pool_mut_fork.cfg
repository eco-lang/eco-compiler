\* M6a mut_fork (plan 6): the mutator forks between operations and its child goes on posting and
\* waiting (four operations: post, fork, post, wait). One mutator only (plan 2.6). Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "mut"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 4
    NWorkers = 1
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    ChildNoStranded
    ChildLocksFree
    PoolRunOnce
    WaitSeesDone
PROPERTIES
    MutatorProgress
    ChildProgress
CHECK_DEADLOCK FALSE
