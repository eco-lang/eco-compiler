\* M6b host_fork_stall: the owner relaunches while the fork's stopAndJoin waits (CR-023).
\* As built it violated StopWaitsOwnEpisode (the prepare waited out an episode it did not stop);
\* since register-fixes §7.2 the fork hold refuses the relaunch and stopAndJoin waits on its own
\* generation (gangs_foreign_stop covers a stop with no hold). Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Forker = "host"
    ForkAllowed = TRUE
    PrepareOrder = "bg_first"
    ExitAllowed = FALSE
    Work0 = 2
    Steps = 1
    B = 1
    MarkThreads = 2
    TwoGangs = FALSE
    ForeignStop = FALSE
    RelaunchWaitsStopper = FALSE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    StopWaitsOwnEpisode
    LJ_RunningExact
PROPERTIES
    ParentProgress
CHECK_DEADLOCK FALSE
