    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 4
    NWorkers = 1
    FIX = "none"
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
