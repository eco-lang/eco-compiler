\* M6b two_gangs_window: the 7c collector as a second gang; another thread forks. As built
\* it violated ChildHeldTenure (CR-013's window: a relaunched collector member is mid-item at fork);
\* since register-fixes §7.2 step 4 the launch is refused while the fork hold is set and the
\* orphan path finishes the job. Mutants: no_fork_hold, hold_after_stop. Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Forker = "host"
    ForkAllowed = TRUE
    PrepareOrder = "bg_first"
    ExitAllowed = FALSE
    Work0 = 2
    Steps = 1
    B = 1
    MarkThreads = 2
    TwoGangs = TRUE
    ForeignStop = FALSE
    RelaunchWaitsStopper = FALSE
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    ChildHeldTenure
    ChildHeldAny
    LJ_RunningExact
    LaunchIdle
    ClosingFinished
PROPERTIES
    ParentProgress
CHECK_DEADLOCK FALSE
