\* M6a trace (TracePool.tla): a recorded pool_trace.cpp run. Accepted iff TLC reports
\* "Invariant TPUnmatched is violated" (a behaviour matched the whole log).
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs <- TP_Jobs
    Forker <- TP_Forker
    ForkAllowed <- TP_ForkAllowed
    ChildUsesPool = FALSE
    MaxOps <- TP_MaxOps
    NWorkers = 1
    FIX = "none"
    GUARD = "none"
    MUTANT = "none"
    PWorkers <- TP_PWorkers
    CWorkers <- TP_CWorkers
INIT TraceInit
NEXT TraceNext
INVARIANT TPUnmatched
CHECK_DEADLOCK FALSE
