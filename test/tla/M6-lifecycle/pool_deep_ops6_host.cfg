\* M6a deep: one worker, six mutator operations, another thread forks. Since register-fixes §7.2 (the fix is the default) the child invariants are checked too.
\* Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 6
    NWorkers = 1
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    ChildNoStranded
    ChildLocksFree
    PoolRunOnce
    WaitSeesDone
PROPERTIES
    ParentJobsFinish
    MutatorProgress
CHECK_DEADLOCK FALSE
