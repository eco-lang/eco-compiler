\* M6a host_fork_stranded (plan 6): another thread forks while the mutator posts. As built (to
\* 2026-09) it violated ChildNoStranded (CR-003); since register-fixes §7.2 (post's CAS and enqueue
\* in one m_ section, the drain keeps m_, thread_mutex_ locked first) it passes: the default.
\* The pre-fix handlers are mutants/pool_as_built_2026_09. Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 3
    NWorkers = 1
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    ChildNoStranded
    ChildLocksFree
    PoolRunOnce
    WaitSeesDone
PROPERTIES
    ParentJobsFinish
    MutatorProgress
CHECK_DEADLOCK FALSE
