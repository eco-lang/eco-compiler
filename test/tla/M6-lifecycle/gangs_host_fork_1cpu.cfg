\* M6b host_fork_1cpu: one CPU (prepare order mark_first, mark_threads_ = 1: the closing join runs
\* inline and takes no run_m_, so the mark gang's prepare does not wait for it); another thread
\* forks. Expected: pass.
CONSTANTS
    defaultInitValue = defaultInitValue
    Forker = "host"
    ForkAllowed = TRUE
    PrepareOrder = "mark_first"
    ExitAllowed = FALSE
    Work0 = 2
    Steps = 1
    B = 1
    MarkThreads = 1
    TwoGangs = FALSE
    FIX = "none"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    LJ_JoinExact
    LJ_RunningExact
    LJ_RunJoined
    LaunchIdle
    HandoffClean
PROPERTIES
    ParentProgress
CHECK_DEADLOCK FALSE
