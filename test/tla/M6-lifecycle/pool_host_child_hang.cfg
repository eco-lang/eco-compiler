\* M6a host_child_hang (step 7): another thread forks and its child uses the pool (or calls exit(),
\* whose ~Allocator locks thread_mutex_ and drains). Expected: violates HostChildProgress
\* (CR-015: thread_mutex_ held by the dead mutator; CR-003: a stranded job).
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = TRUE
    MaxOps = 2
    NWorkers = 1
    FIX = "none"
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
PROPERTIES
    HostChildProgress
CHECK_DEADLOCK FALSE
