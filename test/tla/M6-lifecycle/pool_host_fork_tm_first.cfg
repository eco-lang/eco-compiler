\* M6a host_fork_tm_first (step 7): an atfork handler for thread_mutex_ whose prepare runs BEFORE
\* the pool's (registered after it). Every post and wait holds thread_mutex_, so no post can
\* land between the pool's drain and its lock. Expected: pass (fixes CR-003 and CR-015).
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 3
    NWorkers = 1
    FIX = "tm_first"
    GUARD = "none"
    MUTANT = "none"
SPECIFICATION Spec
INVARIANTS
    ChildNoStranded
    ChildLocksFree
    PoolRunOnce
    WaitSeesDone
PROPERTIES
    ParentJobsFinish
    MutatorProgress
CHECK_DEADLOCK FALSE
