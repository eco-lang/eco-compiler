\* M6a mutant no_dequeue: the worker leaves the job at the head of the queue.
\* Expected: violates PoolRunOnce (the job runs twice).
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "mut"
    ForkAllowed = FALSE
    ChildUsesPool = FALSE
    MaxOps = 2
    NWorkers = 1
    FIX = "none"
    GUARD = "none"
    MUTANT = "no_dequeue"
SPECIFICATION Spec
INVARIANTS
    PoolRunOnce
CHECK_DEADLOCK FALSE
