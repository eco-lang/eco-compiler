\* M6b mutant hold_after_stop: the fork hold is set AFTER stopAllForFork (the window stays open
\* between the stops and the hold). Expected: violates ChildHeldTenure.
CONSTANTS
    defaultInitValue = defaultInitValue
    Forker = "host"
    ForkAllowed = TRUE
    PrepareOrder = "bg_first"
    ExitAllowed = FALSE
    Work0 = 2
    Steps = 1
    B = 1
    MarkThreads = 2
    TwoGangs = TRUE
    ForeignStop = FALSE
    RelaunchWaitsStopper = FALSE
    MUTANT = "hold_after_stop"
SPECIFICATION Spec
INVARIANTS
    ChildHeldTenure
CHECK_DEADLOCK FALSE
