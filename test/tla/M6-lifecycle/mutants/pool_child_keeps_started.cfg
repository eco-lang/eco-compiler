\* M6a mutant child_keeps_started: atforkChild does not reset started_, so the child's first post
\* starts no worker. Expected: violates ChildProgress.
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "mut"
    ForkAllowed = TRUE
    ChildUsesPool = FALSE
    MaxOps = 4
    NWorkers = 1
    GUARD = "none"
    MUTANT = "child_keeps_started"
SPECIFICATION Spec
PROPERTIES
    ChildProgress
CHECK_DEADLOCK FALSE
