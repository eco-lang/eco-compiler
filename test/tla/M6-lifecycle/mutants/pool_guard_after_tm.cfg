\* M6a mutant guard_after_tm: the step-7 guard is checked after thread_mutex_ is taken.
\* With the thread_mutex_ layer (the default since register-fixes §7.2) the child's thread_mutex_
\* is free, so this mutant runs without it (MUTANT no_tm, as the guard was designed).
\* Expected: violates HostChildProgress (the dead mutator's thread_mutex_, CR-015).
CONSTANTS
    defaultInitValue = defaultInitValue
    Jobs = {"j1", "j2"}
    Forker = "host"
    ForkAllowed = TRUE
    ChildUsesPool = TRUE
    MaxOps = 2
    NWorkers = 1
    GUARD = "after_tm"
    MUTANT = "no_tm"
SPECIFICATION Spec
PROPERTIES
    HostChildProgress
CHECK_DEADLOCK FALSE
