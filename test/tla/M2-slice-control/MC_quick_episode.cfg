\* M2 episode: a 5c background episode (members 2, 3; the root in deque 2 from launchBackground),
\* one assist by the foreground joiner on slot 1, then the closing join. ParallelEnv.
\* Expected: pass.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 1
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = FALSE
    MaxGiveUps = 1
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
    ScanOnce
    Drain
    TicketsExact
    AssistExact
    ClosingFinished
    BudgetOK
