\* M2 episode_stop: a stop during the closing join (no assist). Expected: violates ClosingFinished
\* (register CR-005: closingFinish's assert(bg_ep_ == Finished) after reapBackground(true)).
\* Flips to "pass" in the change that fixes CR-005.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = TRUE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    ClosingFinished
