\* M2 deep_episode: episode with the deep graph (5 nodes, roots 1 and 3 in deques 2 and 3) and a
\* ring of 2. Expected: pass.
CONSTANTS
    Nodes = {1, 2, 3, 4, 5}
    Edges <- MC_DeepEdges
    Roots = {1, 3}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_DeepDeques
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 2
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 1
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = FALSE
    MaxGiveUps = 1
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
    ScanOnce
    Drain
    TicketsExact
    AssistExact
    ClosingFinished
    BudgetOK
