\* M2 wrap: slice3 with a 1-bit epoch (EpochMod = 2). Expected: violates TerminationSafe: the ABA
\* on the state word (two reactivations between a decider's load and its CAS). Documents the
\* protocol's assumption: fewer than 2^31 reactivations in one decision window (MAPPING.md).
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2, 3}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_NoWork
    InitStack <- MC_RootOnStack1
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 2
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
