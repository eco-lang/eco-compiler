\* M2 liveness_help_priv: AllExit for the plain drain after a stopped episode (priv counted, the
\* work in a slot no participant owns).
\* The spurious empty steals are capped at MaxGiveUps per run (plan §4.1). Expected: pass.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {3}
    InitDeque <- MC_RootInDeque3
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 1
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
    ScanOnce
    Drain
    TicketsExact
    AssistExact
    ClosingFinished
    BudgetOK
PROPERTY AllExit
