\* M2 trace validation (TraceSliceControl.tla): the constants come from the log's header, the
\* ticket batch, ring and publish threshold are the code's (kTicketBatch, kRingDepth,
\* kPublishMin). Accepted iff TLC reports "Invariant TPUnmatched is violated" (a behaviour
\* matched the whole log).
CONSTANTS
    Nodes <- TH_Nodes
    Edges <- TH_Edges
    Roots = {1}
    BgSlots <- TH_BgSlots
    FgSlot <- TH_FgSlot
    VictimSlots = {}
    InitDeque <- TH_InitDeque
    InitStack <- TH_InitStack
    Budget0 <- TH_Budget0
    TB = 256
    RING = 16
    PUB_MIN = 64
    AnyWorkCountsPriv = TRUE
    StopAllowed <- TH_Stop
    AssistRuns <- TH_Assists
    AssistBudget <- TH_ABudget
    DoClosing <- TH_Closing
    CapGiveUps = FALSE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
    Reachable <- TH_NoReach
INIT TraceInit
NEXT TraceNext
INVARIANT TPUnmatched
CHECK_DEADLOCK FALSE
