\* M2 mutant two_word on slice3: separate active and done atomics (the first 5b build, plan §2.3): the decider stores done
\* without a CAS from the word it loaded. Three participants: with two, the violation needs a
\* steal that finds nothing while an idle marker's published entry is in reach, which stealAny
\* cannot return (AUDIT.md).
\* Expected: violates TerminationSafe.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2, 3}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_NoWork
    InitStack <- MC_RootOnStack1
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "two_word"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
