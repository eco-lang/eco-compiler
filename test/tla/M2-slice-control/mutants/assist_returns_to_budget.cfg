\* M2 mutant assist_returns_to_budget on episode: the assist returns its unused tickets to c.budget instead of its own pool.
\* Expected: violates AssistExact.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 1
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "assist_returns_to_budget"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    AssistExact
