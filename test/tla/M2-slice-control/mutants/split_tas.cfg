\* M2 mutant split_tas on minor: the mark test-and-set as a plain load and a later plain store: two scanners both grey node 4.
\* Expected: violates ScanOnce.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_RootInDeque1
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = FALSE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "split_tas"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    ScanOnce
