\* M2 mutant skip_exit_publish on tenure_l3 (plan open question 2): a stopped L3 collector that
\* leaves with private work. The hook exists only in ParallelEnv; this shows why every exit's
\* publishAllP matters in the deques-only environments too. Expected: violates Drain.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_RootInDeque1
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = FALSE
    StopAllowed = TRUE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "skip_exit_publish"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    Drain
