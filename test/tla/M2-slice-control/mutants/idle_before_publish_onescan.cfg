\* M2 mutant idle_before_publish_onescan on slice: trap 5 with priv counted, and a decider that commits on its first anyWork (no re-check):
\* its deque load misses the publish and its priv load comes after it. With the re-check the
\* same mutant passes (idle_before_publish_slice): priv and the double scan are both needed.
\* Model-only (the SC counterpart of W2's w2_idle_before_publish_onescan_sc).
\* Expected: violates TerminationSafe.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_NoWork
    InitStack <- MC_RootOnStack1
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "idle_before_publish_onescan"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
