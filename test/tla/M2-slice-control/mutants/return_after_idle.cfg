\* M2 mutant return_after_idle on slice: return tickets AFTER goIdle (05b trap 3): an idle marker holds the last ticket while the
\* decider sees budget = 0.
\* Expected: violates TerminationSafe.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_NoWork
    InitStack <- MC_RootOnStack1
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "return_after_idle"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
