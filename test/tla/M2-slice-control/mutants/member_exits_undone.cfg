\* M2 mutant member_exits_undone (register-fixes §7.2 step 9): an idle member leaves its loop with
\* neither done nor a stop, so the closing join's members end undone with no stop (the case the
\* fixed ClosingFinished still rejects). Expected: violates ClosingFinished.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = TRUE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "member_exits_undone"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    ClosingFinished
