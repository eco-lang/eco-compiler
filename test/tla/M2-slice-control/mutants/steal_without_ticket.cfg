\* M2 mutant steal_without_ticket on slice: the SliceControl::steal_without_ticket hook (runMarkerLoop): steal first, and scan without a
\* ticket when the claim then fails.
\* Expected: violates TicketsExact.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_NoWork
    InitStack <- MC_RootOnStack1
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "steal_without_ticket"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TicketsExact
