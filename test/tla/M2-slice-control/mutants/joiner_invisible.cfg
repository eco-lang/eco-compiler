\* M2 mutant joiner_invisible on episode: an assist that never touches the state word (no reactivate, no goIdle): the members decide
\* done while it holds an entry, and it then pushes the entry's children (plan §5's story for
\* joiner_no_reactivate).
\* Expected: violates TerminationSafe.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = FALSE
    AssistRuns = 1
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "joiner_invisible"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
