\* M2 mutant skip_exit_publish on episode_bgstop: the IM15 negative control test_leave_private_on_exit_: ParallelEnv::publishAll returns at
\* once at every call site; a stopped participant leaves with private work.
\* Expected: violates Drain.
\* Give-ups: only when every other deque is empty (CapGiveUps, MaxGiveUps = 0), so the
\* counterexample is one the code can produce.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = TRUE
    AssistRuns = 1
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = TRUE
    MaxGiveUps = 0
    EpochMod = 0
    MUTANT = "skip_exit_publish"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    Drain
