\* M2 negative control for BudgetOK (a check of the model's own abstraction): minor with a budget
\* that can run out (3 tickets for 4 nodes) while the idle loop's budget loads stay folded as if
\* it could not (BudgetNeverEmpty overridden). Expected: violates BudgetOK.
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {1, 2}
    FgSlot = 0
    VictimSlots = {}
    InitDeque <- MC_RootInDeque1
    InitStack <- MC_NoWork
    Budget0 = 3
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = FALSE
    StopAllowed = FALSE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = FALSE
    CapGiveUps = FALSE
    MaxGiveUps = 1
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
    BudgetNeverEmpty <- MC_Always
SPECIFICATION Spec
INVARIANTS
    BudgetOK
