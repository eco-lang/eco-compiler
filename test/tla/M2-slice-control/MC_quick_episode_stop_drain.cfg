\* M2 episode_stop_drain: episode_stop with every invariant but ClosingFinished. Expected: pass:
\* apart from CR-005's assert, the stopped closing join leaves its work in the deques for the
\* plain drain (closingFinish -> runMarkers, configuration help_priv).
CONSTANTS
    Nodes = {1, 2, 3, 4}
    Edges <- MC_Edges
    Roots = {1}
    BgSlots = {2, 3}
    FgSlot = 1
    VictimSlots = {}
    InitDeque <- MC_RootInDeque2
    InitStack <- MC_NoWork
    Budget0 = 40
    TB = 2
    RING = 1
    PUB_MIN = 2
    AnyWorkCountsPriv = TRUE
    StopAllowed = TRUE
    AssistRuns = 0
    AssistBudget = 2
    DoClosing = TRUE
    CapGiveUps = FALSE
    MaxGiveUps = 1
    EpochMod = 0
    MUTANT = "none"
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    TerminationSafe
    ScanOnce
    Drain
    TicketsExact
    AssistExact
    BudgetOK
