\* M7a pw_aba (ABA audit, 2026-09-29): every extent starts owned and there is no window
\* (InitFresh empty), so all 10 caller operations go to release -> age -> reuse -> re-release
\* cycles. An extent id is its start address, the key of PageWork::pending_ and
\* posted_discard_, so the same key is recorded again (Pending, then Posted in either slot)
\* while an earlier record's job may still be Done but unreaped. Two workers run two
\* discards at once. Every invariant. Expected: pass. The code never splits or coalesces
\* a free extent, so an overlap with a DIFFERENT start is not a code behaviour
\* (MAPPING.md §3).
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2, 3}
    InitFresh = {}
    Slots = {1, 2}
    Workers = {"w1", "w2"}
    MaxOps = 10
    MUTANT = "none"
    NoWait = TRUE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    HEAP_059
    HEAP_060
    V1
    NoOwnedPosted
    TrackedInFree
    DetChoice
    PostIdle
    NoWaitUnlessCap
    PendGhost
CHECK_DEADLOCK FALSE
