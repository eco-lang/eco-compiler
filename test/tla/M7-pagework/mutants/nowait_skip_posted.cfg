\* M7a mutant (register-fixes §6.3, CR-007, plan trap: "any predicate that reads posted_discard_,
\* isDone or isPendingOrPosted breaks DetChoice"): the no-wait acquire skips only the extents whose
\* discard is still Posted, so it takes a reaped (discarded, job Done) extent when one precedes a
\* Pending one -- which extent it gets depends on helper progress. Expected: violates DetChoice.
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2}
    InitFresh = {3}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 6
    MUTANT = "nowait_skip_posted"
    NoWait = TRUE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANT DetChoice
CHECK_DEADLOCK FALSE
