\* M7a mutant drain_no_await (HEAP_076, plans/frontend-heap-release.md §3.8): the explicit
\* release's drainAll(true) discards the Pending extents without awaiting the job slots first.
\* Expected: violates DrainSafe (a slot is still Posted or Running at the inline discard).
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2}
    InitFresh = {3}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 4
    MUTANT = "drain_no_await"
    NoWait = FALSE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANT DrainSafe
CHECK_DEADLOCK FALSE
