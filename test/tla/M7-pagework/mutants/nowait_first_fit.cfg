\* M7a mutant (register-fixes §6.3, CR-007): the promotion holder's acquire keeps today's first fit
\* (no policy), so it meets a Posted extent and waits on the helper job although a fresh extent is
\* left below the cap. Expected: violates NoWaitUnlessCap.
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2}
    InitFresh = {3}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 6
    MUTANT = "nowait_first_fit"
    NoWait = TRUE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANT NoWaitUnlessCap
CHECK_DEADLOCK FALSE
