\* M7a mutant reuse_bypass: a reuse route that takes a free-list extent without calling onReuse (added: V2a had no mutant).
\* Expected: violates TrackedInFree (AUDIT.md has the counterexample).
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2}
    InitFresh = {3}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 4
    MUTANT = "reuse_bypass"
    NoWait = FALSE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANT TrackedInFree
CHECK_DEADLOCK FALSE
