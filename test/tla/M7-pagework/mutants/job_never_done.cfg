\* M7a mutant job_never_done: the pool loses a job: it never becomes Done (breaks PoolJob; added: MutatorFinishes had no mutant).
\* No window (trap 11): the story is a reuse waiting on a lost discard, not a
\* repeated window, which topUpWindow never posts.
\* Expected: violates MutatorFinishes (AUDIT.md has the counterexample).
CONSTANTS
    Extents = {1, 2}
    InitHeap = {1, 2}
    InitFresh = {}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 4
    MUTANT = "job_never_done"
    NoWait = FALSE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
PROPERTY MutatorFinishes
CHECK_DEADLOCK FALSE
