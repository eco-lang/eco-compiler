\* M7a mutant takeslot_no_wait: takeSlot hands back the oldest busy slot without awaitSlot (added with PostIdle).
\* One slot and no window (trap 11): the model's free window choice could fill the
\* slots with repeated windows over one extent, which topUpWindow never posts, so this
\* configuration fills the slot with the code's own path, two discard batches.
\* Expected: violates PostIdle (AUDIT.md has the counterexample).
CONSTANTS
    Extents = {1, 2}
    InitHeap = {1, 2}
    InitFresh = {}
    Slots = {1}
    Workers = {"w1"}
    MaxOps = 4
    MUTANT = "takeslot_no_wait"
    NoWait = FALSE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANT PostIdle
CHECK_DEADLOCK FALSE
