\* M7a pw_nowait (register-fixes §6.3, CR-007): pw_basic's geometry with one more operation, so
\* the no-wait acquire meets every case: a Pending extent (cancelled), a fresh bump, and -- once
\* the one fresh extent is gone -- the cap fallback over a Posted extent (which may wait).
\* NoWaitUnlessCap is CR-007's rule; DetChoice shows the skip is job-blind. Expected: pass.
CONSTANTS
    Extents = {1, 2, 3}
    InitHeap = {1, 2}
    InitFresh = {3}
    Slots = {1, 2}
    Workers = {"w1"}
    MaxOps = 6
    MUTANT = "none"
    NoWait = TRUE
    defaultInitValue = defaultInitValue
SPECIFICATION Spec
INVARIANTS
    NoWaitUnlessCap
    DetChoice
    PendGhost
    DrainSafe
    HEAP_059
    HEAP_060
    V1
    NoOwnedPosted
    TrackedInFree
    PostIdle
PROPERTY MutatorFinishes
CHECK_DEADLOCK FALSE
