\* M4 trace validation with the checks on: TracePromoBitmap.cfg plus the race
\* detector and the safety invariants on the replay. NOT a traces.txt row: its
\* verdict depends on the schedule (the runner knows only accept / reject). Run it
\* by hand on a merged log (AUDIT.md, 2026-09-29 trace wave): "Invariant
\* TLUnmatched is violated" = the whole log matched with no race and no
\* violation; any other invariant violated = the real run did that (CR-002's
\* NoRaceBitmap in every multi-threaded registered run, 16 of 16).
CONSTANTS
    NAllocs <- TPA_NAllocs
    ClaimK = {1, 2, 4, 8, 16, 32}
    BatchMax = 17
    Breadth = FALSE
    MUTANT = {}
    Workers <- TPA_Workers
    Markers = {}
    Collectors = {}
    Mutators = {}
    Mergers <- TPA_Mergers
    TwoClasses = FALSE
    NGrant = 0
    Cells <- TPA_Cells
    Blocks <- TPA_Blocks
    Bytes <- TPA_Bytes
    CellBlock <- TPA_CellBlock
    CellByte <- TPA_CellByte
    ByteWord <- TPA_ByteWord
    MixedBlocks <- TPA_Mixed
    Present <- TPA_Blocks
    ChunkUnits <- TPA_Units
    PastEnd <- TPA_PastEnd
    T0Blocks = {}
    T0Live = {}
    GrantBlock = "none"
    CursorBlock = "none"
    MarkerTodo = {}
    InitBits <- TPA_InitBits
    InitFree <- TPA_InitFree
    InitQ <- TPA_InitQ
    InitPhase <- TPA_InitPhase
    InitShared <- TPA_InitShared
    InitPartial <- TPA_InitPartial
    InitLive <- TPA_InitLive
    PreAlloc <- TPA_PreAlloc
    InitGrantOn = FALSE
    VirginQ <- TPA_Virgin
INIT TraceInit
NEXT TraceNext
INVARIANTS
    NoRaceBitmap
    NoRacePhase
    NoRaceLive
    NoDoubleAlloc
    ClaimsInRange
    FreeBehindCursor
    DetachNotCurrent
    ReleasedSafe
    TLUnmatched
CHECK_DEADLOCK FALSE
