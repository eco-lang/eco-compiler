\* M8 CR-018: a mixed-block cell handed out at Idle is not counted in live_bytes; an
\* exact-page request flips the block over the live object. Expected: violates:NoOverwriteLive.
CONSTANTS
    G = 6
    NC = 2
    NCLS = 3
    CellSize <- MC_Cells6
    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 2
    NObj = 3
    MaxOps = 5
    PromoAge = 1
    MutSizes = {4, 6}
    YlosSizes = {}
    PromoSizes = {}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_All
    MUTANT = {}
INIT Init
NEXT Next
INVARIANTS
    NoOverwriteLive
ALIAS MC_Alias
