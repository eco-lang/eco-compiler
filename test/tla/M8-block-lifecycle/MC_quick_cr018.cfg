    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 2
    NObj = 3
    MaxOps = 5
    PromoAge = 1
    MutSizes = {4, 6}
    YlosSizes = {}
    PromoSizes = {}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_All
    MUTANT = {}
INIT Init
NEXT Next
INVARIANTS
    NoOverwriteLive
ALIAS MC_Alias
