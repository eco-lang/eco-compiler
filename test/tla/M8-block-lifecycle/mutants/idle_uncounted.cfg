\* M8 mutant idle_uncounted (A6 regression mutant of CR-018 / HEAP_073): the pre-fix
\* initObjectHeaderWithSize, a mixed-block cell handed out at Idle is not counted in live_bytes;
\* an exact-page request flips the block over the live object. Expected: violates:NoOverwriteLive.
