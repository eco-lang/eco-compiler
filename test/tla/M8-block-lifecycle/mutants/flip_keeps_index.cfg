\* M8 mutant flip_keeps_index (A6 regression mutant of CR-035 / HEAP_056): the pre-fix flip keeps
\* the large-body index entries of the flipped block. On CR-018's pre-fix precondition
\* (idle_uncounted), the flip over a DEAD young large object Y keeps Y's meta, whose key is now the
\* new object's (Keep: no step overwrites a rooted object). Expected: violates:IndexFaithful.
CONSTANTS
    G = 6
    NC = 2
    NCLS = 3
    CellSize <- MC_Cells6
    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 2
    NObj = 4
    MaxOps = 7
    PromoAge = 1
    MutSizes = {4}
    YlosSizes = {4, 6}
    PromoSizes = {}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_NoLiveOverwrite
    MUTANT = {"idle_uncounted", "flip_keeps_index"}
    LOS = FALSE
    LosKeep = 1
INIT Init
NEXT Next
INVARIANTS
    IndexFaithful
ALIAS MC_Alias
