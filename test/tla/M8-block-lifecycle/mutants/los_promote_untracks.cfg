\* M8 mutant los_promote_untracks (plans/large-object-space.md; the 2026-10-09 leak found by
\* LargeBodyChurn (b)): promotion in place erases the young large object's index entry, as the
\* pre-LOS code did, while the object stays in its LOS block: the LOS frees only through the
\* index, so the object is never freed. Expected: violates:LosTracked.
CONSTANTS
    G = 6
    NC = 2
    NCLS = 3
    CellSize <- MC_Cells6
    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 2
    NObj = 3
    MaxOps = 5
    PromoAge = 0
    MutSizes = {}
    YlosSizes = {3}
    PromoSizes = {}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_All
    MUTANT = {"promote_untracks"}
    LOS = TRUE
    LosKeep = 1
INIT Init
NEXT Next
INVARIANTS
    LosTracked
ALIAS MC_Alias
