    NC = 2
    NCLS = 3
    CellSize <- MC_Cells6
    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 3
    NObj = 4
    MaxOps = 6
    PromoAge = 1
    MutSizes = {2, 3}
    YlosSizes = {2, 3}
    PromoSizes = {2, 3}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_All
    MUTANT = {}
    LOS = TRUE
    LosKeep = 0
INIT Init
NEXT Next
INVARIANTS
    NoLostObject
    NoOverwriteLive
    NoDoubleAlloc
    BlockParseable
    IndexFaithful
    FreeListsInLiveBlocks
    FlipTrustsTruth
    SideTablesFaithful
    LosTracked
    LosSeparation
