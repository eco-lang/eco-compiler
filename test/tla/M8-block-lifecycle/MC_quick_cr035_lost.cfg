\* M8 CR-035's S1: the next minor frees Y's stale meta, erasing the new object's key;
\* the one after frees the live object's block. Expected: violates:NoLostObject.
CONSTANTS
    G = 6
    NC = 2
    NCLS = 3
    CellSize <- MC_Cells6
    NS = 2
    InitPages = 1
    MinHeap = 1
    NIds = 3
    NMeta = 2
    NObj = 4
    MaxOps = 8
    PromoAge = 1
    MutSizes = {4}
    YlosSizes = {4, 6}
    PromoSizes = {}
    BagFirst = TRUE
    DemoteMax <- MC_Off
    Cov = FALSE
    Keep <- MC_NoLiveOverwrite
    MUTANT = {}
INIT Init
NEXT Next
INVARIANTS
    NoLostObject
ALIAS MC_Alias
