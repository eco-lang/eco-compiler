\* M3 mutant never_publish, liveness form: a claimant never publishes, so a waiter never exits.
\* Deadlock checking off, so TLC reports the stuck behaviour against the property. Expected: violates Termination.
CONSTANTS
    defaultInitValue = defaultInitValue
    Workers = {1, 2}
    W0 = 1
    FromIds <- MC_FromIds
    ConsIds <- MC_ConsIds
    YlosIds <- MC_YlosIds
    OldIds <- MC_OldIds
    HandIds <- MC_NoIds
    RetireIds <- MC_NoIds
    RetireFwd <- MC_NoRetire
    InitFields <- MC_Fields
    InitRoots <- MC_Roots
    Age <- MC_Age
    Builders <- MC_Builders
    PromoAge <- MC_PromoAge
    Mode = "legacy"
    MaxRun = 1
    MUTANT = "never_publish"
    Unfwd = Unfwd
    Busy = Busy
SPECIFICATION Spec
PROPERTY Termination
CHECK_DEADLOCK FALSE
