\* M3 trace validation (TraceMinorForwarding.tla). Accepted iff TLC reports
\* "Invariant TPUnmatched is violated" (a behaviour matched the whole log).
\* The heap, the worker count and the spine run come from the log's header.
CONSTANTS
    defaultInitValue = defaultInitValue
    Workers <- TH_Workers
    W0 = 1
    FromIds <- TH_FromIds
    ConsIds <- TH_ConsIds
    YlosIds <- TH_YlosIds
    OldIds <- TH_OldIds
    HandIds <- TH_NoIds
    RetireIds <- TH_NoIds
    RetireFwd <- TH_NoRetire
    InitFields <- TH_Fields
    InitRoots <- TH_Roots
    Age <- TH_Age
    Builders <- TH_NoIds
    PromoAge <- TH_PromoAge
    Mode = "legacy"
    MaxRun <- TH_MaxRun
    MUTANT = "none"
    Unfwd = Unfwd
    Busy = Busy
INIT TraceInit
NEXT TraceNext
INVARIANT TPUnmatched
CHECK_DEADLOCK FALSE
